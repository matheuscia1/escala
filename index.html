<!DOCTYPE html>
<html lang="pt-br" data-theme="blue">
<head>
<meta charset="UTF-8">
<title>Escala Médica</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>

<style>
/* ==================== TEMA AZUL (PADRÃO) ==================== */
:root,
[data-theme="blue"] {
  --bg: #f0f4f8;
  --bg-soft: #e3ecf4;
  --paper: #ffffff;
  --ink: #0f2840;
  --ink-soft: #355068;
  --ink-muted: #7a8fa3;
  --line: #d4dfeb;
  --line-soft: #e8eef5;
  --accent: #0a6cb8;
  --accent-deep: #074d83;
  --accent-soft: #dceaf7;
  --weekend: #f4f8fc;
  --day-color: #0a6cb8;
  --block-stripe: rgba(10, 108, 184, 0.16);
  --shift: #0d7a5f;
  --shift-soft: #d6ebe3;
}

/* ==================== TEMA CINZA ==================== */
[data-theme="gray"] {
  --bg: #f5f6f8;
  --bg-soft: #eceef2;
  --paper: #ffffff;
  --ink: #1f2937;
  --ink-soft: #4b5563;
  --ink-muted: #9ca3af;
  --line: #e2e5ea;
  --line-soft: #eef0f3;
  --accent: #4b5563;
  --accent-deep: #1f2937;
  --accent-soft: #e5e7eb;
  --weekend: #f7f8fa;
  --day-color: #374151;
  --block-stripe: rgba(75, 85, 99, 0.18);
  --shift: #374151;
  --shift-soft: #e5e7eb;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background 0.25s ease, color 0.25s ease;
}

body { display: flex; min-height: 100vh; }

/* ==================== SIDEBAR ==================== */
.sidebar {
  width: 260px;
  background: var(--paper);
  border-right: 1px solid var(--line);
  padding: 22px 18px;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  transition: background 0.25s ease, border-color 0.25s ease;
}

.sidebar h3 {
  font-family: "IBM Plex Sans", sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin: 0 0 14px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.count-badge {
  background: var(--bg-soft);
  color: var(--ink-soft);
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  font-family: "IBM Plex Mono", monospace;
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}

.sidebar input[type="text"] {
  padding: 9px 12px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--paper);
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
  transition: all 0.15s ease;
}

.sidebar input[type="text"]:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.btn-add {
  padding: 9px 12px;
  border-radius: 6px;
  border: none;
  background: var(--accent);
  color: white;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  transition: background 0.15s ease;
}

.btn-add:hover { background: var(--accent-deep); }

.sidebar-list {
  margin-top: 4px;
  overflow-y: auto;
  flex: 1;
  margin-right: -8px;
  padding-right: 8px;
}

.sidebar-list::-webkit-scrollbar { width: 6px; }
.sidebar-list::-webkit-scrollbar-track { background: transparent; }
.sidebar-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.medico-item {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 8px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  transition: all 0.15s ease;
}

.medico-item:hover { border-color: var(--ink-muted); }

.medico-name {
  flex: 1;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.medico-count {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  color: var(--ink-muted);
  background: var(--bg-soft);
  padding: 2px 6px;
  border-radius: 10px;
  margin-right: 6px;
  min-width: 22px;
  text-align: center;
}

.btn-remove {
  background: transparent;
  border: none;
  color: var(--ink-muted);
  cursor: pointer;
  width: 22px;
  height: 22px;
  border-radius: 4px;
  display: grid;
  place-items: center;
  font-size: 16px;
  padding: 0;
  transition: all 0.15s ease;
  line-height: 1;
}

.btn-remove:hover {
  background: #fee2e2;
  color: #b91c1c;
}

.empty-state {
  text-align: center;
  padding: 24px 12px;
  color: var(--ink-muted);
  font-size: 12px;
  border: 1px dashed var(--line);
  border-radius: 8px;
}

/* THEME SWITCH */
.theme-switch {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--line-soft);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.theme-label {
  font-family: "IBM Plex Mono", monospace;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-muted);
}

.switch {
  position: relative;
  width: 64px;
  height: 26px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s ease;
  flex-shrink: 0;
}

.switch::before {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  background: var(--accent);
  border-radius: 50%;
  transition: transform 0.25s cubic-bezier(.34,1.4,.64,1);
}

[data-theme="blue"] .switch::before {
  transform: translateX(38px);
}

.switch-icons {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6px;
  pointer-events: none;
}

.switch-icons span {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  font-size: 9px;
  font-family: "IBM Plex Mono", monospace;
  font-weight: 600;
  color: var(--ink-muted);
  transition: color 0.2s;
}

[data-theme="gray"] .switch-icons span:first-child { color: white; }
[data-theme="blue"] .switch-icons span:last-child { color: white; }

/* ==================== MAIN ==================== */
.container {
  flex: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px 36px 50px;
}

.header {
  text-align: center;
  margin-bottom: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.hospital-name {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
  outline: none;
  cursor: text;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px dashed transparent;
  transition: all 0.15s ease;
  display: inline-block;
}

.hospital-name:hover {
  border-color: var(--line);
  background: var(--paper);
}

.hospital-name:focus {
  border-color: var(--accent);
  background: var(--paper);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.title {
  font-family: "IBM Plex Sans", sans-serif;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink);
  outline: none;
  cursor: text;
  padding: 4px 10px;
  border-radius: 5px;
  border: 1px dashed transparent;
  transition: all 0.15s ease;
  display: inline-block;
  margin: 0;
  line-height: 1.2;
}

.title:hover {
  border-color: var(--line);
  background: var(--paper);
}

.title:focus {
  border-color: var(--accent);
  background: var(--paper);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.month-label {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  color: var(--ink-muted);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-top: 10px;
}

.month-label strong {
  color: var(--ink);
  font-weight: 500;
}

.controls {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
}

.select-wrap { position: relative; }

.select-wrap::after {
  content: '▾';
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  color: var(--ink-muted);
  pointer-events: none;
}

select {
  appearance: none;
  -webkit-appearance: none;
  padding: 8px 30px 8px 12px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--paper);
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
}

select:hover { border-color: var(--ink-muted); }
select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.btn-pdf {
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: white;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: all 0.15s ease;
}

.btn-pdf:hover {
  background: var(--accent-deep);
  border-color: var(--accent-deep);
}

.btn-pdf svg { width: 13px; height: 13px; }

/* Botão secundário (importar) */
.btn-import {
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink-soft);
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: all 0.15s ease;
}

.btn-import:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--paper);
}

.btn-import svg { width: 13px; height: 13px; }

/* Esteganograma - dados invisíveis embutidos no PDF */
.pdf-data-vault {
  position: absolute;
  bottom: 2mm;
  left: 2mm;
  right: 2mm;
  font-family: monospace;
  font-size: 1px;
  line-height: 1;
  color: white;
  word-break: break-all;
  pointer-events: none;
  user-select: none;
  z-index: -1;
  display: none;
}

@media print {
  .pdf-data-vault {
    display: block !important;
    color: #fefefe !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}

/* Modal de importação */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(2px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}

.modal-backdrop.open { display: flex; }

.modal {
  background: var(--paper);
  border-radius: 10px;
  border: 1px solid var(--line);
  box-shadow: 0 20px 60px rgba(15, 23, 42, 0.2);
  max-width: 480px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
}

.modal h2 {
  margin: 0 0 6px 0;
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
}

.modal-subtitle {
  font-size: 13px;
  color: var(--ink-muted);
  margin-bottom: 18px;
}

.modal-meta {
  background: var(--bg-soft);
  border-radius: 6px;
  padding: 10px 12px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 11.5px;
  color: var(--ink-soft);
  margin-bottom: 18px;
  line-height: 1.7;
}

.modal-meta strong {
  color: var(--ink);
  font-weight: 600;
}

.modal-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}

.modal-option {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.modal-option:hover {
  border-color: var(--accent);
  background: var(--bg-soft);
}

.modal-option input[type="radio"] {
  margin-top: 3px;
  accent-color: var(--accent);
  cursor: pointer;
}

.modal-option-content { flex: 1; }
.modal-option-title {
  font-weight: 600;
  font-size: 13px;
  color: var(--ink);
  margin-bottom: 2px;
}
.modal-option-desc {
  font-size: 12px;
  color: var(--ink-muted);
  line-height: 1.4;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.modal-actions button {
  padding: 8px 16px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink-soft);
  transition: all 0.15s ease;
}

.modal-actions button:hover { border-color: var(--ink-muted); }

.modal-actions button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.modal-actions button.primary:hover {
  background: var(--accent-deep);
  border-color: var(--accent-deep);
}

/* Toast de feedback */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--ink);
  color: white;
  padding: 12px 18px;
  border-radius: 6px;
  font-size: 13px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  z-index: 200;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.25s ease;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

.toast.error { background: #b91c1c; }
.toast.success { background: #0d7a5f; }

.legend {
  display: flex;
  gap: 16px;
  margin-bottom: 14px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-muted);
  justify-content: center;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-swatch {
  width: 13px;
  height: 13px;
  border-radius: 3px;
  border: 1px solid var(--line);
}

.legend-swatch.weekend { background: var(--weekend); }
.legend-swatch.blocked-sw {
  background-image: repeating-linear-gradient(45deg, var(--block-stripe), var(--block-stripe) 3px, transparent 3px, transparent 6px);
  background-color: var(--paper);
}
.legend-swatch.assigned {
  background: var(--paper);
  border: 1px solid var(--shift);
  position: relative;
}
.legend-swatch.assigned::after {
  content: '';
  position: absolute;
  inset: 2px;
  border: 1px solid var(--shift);
  border-radius: 1px;
}

.calendar-wrap {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

thead th {
  background: var(--bg-soft);
  border-bottom: 1px solid var(--line);
  padding: 10px 6px;
  font-family: "IBM Plex Sans", sans-serif;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-soft);
  text-align: center;
}

thead th:not(:last-child) { border-right: 1.5px solid var(--line); }

tbody td {
  border-right: 1.5px solid var(--line);
  border-bottom: 1.5px solid var(--line);
  height: 88px;
  position: relative;
  padding: 6px;
  vertical-align: top;
  background: var(--paper);
  transition: background 0.15s ease;
}

tbody tr:last-child td { border-bottom: none; }
tbody td:last-child { border-right: none; }

tbody td.empty {
  background: var(--bg-soft);
}

.day {
  position: absolute;
  top: 6px;
  right: 10px;
  color: var(--day-color);
  font-weight: 600;
  font-size: 14px;
  font-family: "IBM Plex Sans", sans-serif;
}

.weekend { background-color: var(--weekend); }

.cell-select {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  appearance: none;
  -webkit-appearance: none;
  padding: 5px 8px;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--paper);
  font-family: inherit;
  font-size: 11.5px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
}

.cell-select:hover {
  border-color: var(--ink-muted);
}

.cell-select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

td.assigned { background: var(--paper); }

td.assigned .cell-select {
  background: var(--paper);
  border-color: var(--shift);
  color: #374151;
  font-weight: 600;
}

td.weekend.assigned { background: var(--weekend); }

td.blocked {
  background-image: repeating-linear-gradient(
    45deg,
    var(--block-stripe),
    var(--block-stripe) 4px,
    transparent 4px,
    transparent 9px
  );
}

td.weekend.blocked {
  background-color: var(--weekend);
  background-image: repeating-linear-gradient(
    45deg,
    var(--block-stripe),
    var(--block-stripe) 4px,
    transparent 4px,
    transparent 9px
  );
}

td.blocked .cell-select {
  background: var(--paper);
  color: var(--accent-deep);
  border-color: var(--accent);
  font-weight: 600;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.08em;
}

td:hover:not(.empty) {
  background-color: var(--line-soft);
}

td.weekend:hover:not(.empty) {
  filter: brightness(0.97);
}

td.blocked:hover:not(.empty) { filter: brightness(0.97); }

/* ==================== ASSINATURA ==================== */
.signature {
  margin-top: 80px;
  max-width: 320px;
  padding-top: 8px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.signature-line {
  border-top: 1px solid var(--ink-soft);
  margin-bottom: 6px;
  width: 100%;
  align-self: stretch;
}

.signature-name {
  font-family: "IBM Plex Sans", sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  outline: none;
  cursor: text;
  padding: 3px 8px;
  margin-left: -8px;
  border-radius: 4px;
  border: 1px dashed transparent;
  transition: all 0.15s ease;
  min-height: 22px;
  min-width: 200px;
  display: block;
  margin-bottom: 2px;
  width: fit-content;
  max-width: 100%;
  word-break: break-word;
}

.signature-name:empty::before,
.signature-name[data-empty="true"]::before {
  content: attr(data-placeholder);
  color: var(--ink-muted);
  font-style: italic;
  font-weight: 400;
}

.signature-name:hover {
  border-color: var(--line);
  background: var(--paper);
}

.signature-name:focus {
  border-color: var(--accent);
  background: var(--paper);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.signature-name:focus[data-empty="true"]::before {
  content: '';
}

.signature-label {
  font-family: "IBM Plex Mono", monospace;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-muted);
  outline: none;
  cursor: text;
  padding: 2px 8px;
  margin-left: -8px;
  border-radius: 4px;
  border: 1px dashed transparent;
  transition: all 0.15s ease;
  display: block;
  width: fit-content;
  max-width: 100%;
  word-break: break-word;
}

.signature-label:hover {
  border-color: var(--line);
  background: var(--paper);
}

.signature-label:focus {
  border-color: var(--accent);
  background: var(--paper);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

/* ==================== PRINT ==================== */
.print-text { display: none; }

@media print {
  @page { size: A4 landscape; margin: 10mm; }
  html, body { background: white !important; }
  body { display: block; }
  .sidebar, .controls { display: none !important; }
  .container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
  .header { margin-bottom: 12px; }
  .title {
    font-size: 22px !important;
    border: none !important;
    padding: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
  }
  .hospital-name {
    font-size: 11px !important;
    border: none !important;
    background: transparent !important;
  }
  .month-label { font-size: 10px !important; }
  .legend { margin-bottom: 8px; }
  .calendar-wrap { border: 1.5px solid #888 !important; page-break-inside: avoid; }
  thead th {
    border-right: 1px solid #aaa !important;
    border-bottom: 1.5px solid #888 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  tbody td {
    height: 76px !important;
    border-right: 1px solid #b8b8b8 !important;
    border-bottom: 1px solid #b8b8b8 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .cell-select { display: none !important; }
  .print-text {
    display: block;
    position: absolute;
    bottom: 8px;
    left: 8px;
    right: 8px;
    font-size: 11.5px;
    font-weight: 600;
    color: #374151;
    line-height: 1.2;
    word-break: break-word;
  }
  .print-text.is-block {
    color: var(--accent-deep);
    text-transform: uppercase;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    font-weight: 700;
  }
  td.weekend, td.assigned, td.blocked, td.empty {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Assinatura no PDF */
  .signature {
    margin-top: 60px !important;
    page-break-inside: avoid;
  }

  .signature-name,
  .signature-label {
    border: none !important;
    background: transparent !important;
    padding: 0 !important;
    margin-left: 0 !important;
    box-shadow: none !important;
  }

  /* Esconde o bloco inteiro quando o nome está vazio */
  .signature[data-hidden="true"] {
    display: none !important;
  }

  /* Esconde placeholders na impressão */
  .signature-name:empty::before,
  .signature-name[data-empty="true"]::before {
    content: '' !important;
  }
}

@media (max-width: 900px) {
  body { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--line); }
  .container { padding: 22px 16px; }
  tbody td { height: 76px; }
}
</style>
</head>

<body>

<aside class="sidebar">
  <h3>
    <span>Médicos</span>
    <span class="count-badge" id="counter">0</span>
  </h3>

  <div class="input-group">
    <input type="text" id="medicoInput" placeholder="Nome do médico" onkeydown="if(event.key==='Enter')addMedico()">
    <button class="btn-add" onclick="addMedico()">Adicionar</button>
  </div>

  <div class="sidebar-list" id="listaMedicos"></div>

  <div class="theme-switch">
    <span class="theme-label">Tema</span>
    <div class="switch" onclick="toggleTheme()" title="Alternar entre cinza e azul" role="switch" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')toggleTheme()">
      <div class="switch-icons">
        <span>CZ</span>
        <span>AZ</span>
      </div>
    </div>
  </div>
</aside>

<main class="container" id="area">

  <header class="header">
    <div class="hospital-name" contenteditable="true" spellcheck="false">Hospital Regional de Estância</div>
    <h1 class="title" contenteditable="true" spellcheck="false">Escala Médica</h1>
    <div class="month-label" id="monthLabel"></div>
  </header>

  <div class="controls">
    <div class="select-wrap">
      <select id="monthSelect"></select>
    </div>
    <div class="select-wrap">
      <select id="yearSelect"></select>
    </div>
    <button class="btn-import" onclick="document.getElementById('importInput').click()" title="Importar dados de uma escala PDF gerada por este sistema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Importar PDF
    </button>
    <input type="file" id="importInput" accept="application/pdf,.pdf" style="display:none" onchange="handleImport(event)">
    <button class="btn-pdf" onclick="exportPDF()" title="Abre o diálogo de impressão — escolha 'Salvar como PDF'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9V2h12v7"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      Imprimir / PDF
    </button>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-swatch assigned"></div> Plantão atribuído</div>
    <div class="legend-item"><div class="legend-swatch weekend"></div> Fim de semana</div>
    <div class="legend-item"><div class="legend-swatch blocked-sw"></div> Bloqueado</div>
  </div>

  <div class="calendar-wrap">
    <table id="calendar">
      <thead>
        <tr>
          <th>Seg</th><th>Ter</th><th>Qua</th>
          <th>Qui</th><th>Sex</th>
          <th>Sáb</th><th>Dom</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Assinatura do coordenador -->
  <div class="signature" id="signatureBlock">
    <div class="signature-line"></div>
    <div class="signature-name" contenteditable="true" spellcheck="false" data-placeholder="Nome do coordenador" oninput="updateSignatureState()">​</div>
    <div class="signature-label" contenteditable="true" spellcheck="false" data-placeholder="Cargo / função (ex: Coordenador médico)">Coordenador médico</div>
  </div>

  <!-- Esteganograma: dados invisíveis embutidos no PDF para reimportação -->
  <div class="pdf-data-vault" id="pdfDataVault"></div>
</main>

<!-- Modal de importação -->
<div class="modal-backdrop" id="importModal">
  <div class="modal">
    <h2>Importar escala</h2>
    <div class="modal-subtitle">Escala detectada no PDF. Escolha como aplicar.</div>

    <div class="modal-meta" id="modalMeta"></div>

    <div class="modal-options" id="modalOptions">
      <label class="modal-option">
        <input type="radio" name="importMode" value="weekday-ordinal" checked>
        <div class="modal-option-content">
          <div class="modal-option-title">Por dia da semana (ordinal)</div>
          <div class="modal-option-desc">1ª segunda → 1ª segunda, 2ª quinta → 2ª quinta. Preserva escalas quinzenais e plantonistas fixos por dia da semana.</div>
        </div>
      </label>

      <label class="modal-option">
        <input type="radio" name="importMode" value="weekday-simple">
        <div class="modal-option-content">
          <div class="modal-option-title">Por dia da semana (simples)</div>
          <div class="modal-option-desc">Cada dia da semana repete o último plantonista visto naquele dia. Útil quando o plantão é totalmente fixo.</div>
        </div>
      </label>

      <label class="modal-option">
        <input type="radio" name="importMode" value="exact-date">
        <div class="modal-option-content">
          <div class="modal-option-title">Por data exata</div>
          <div class="modal-option-desc">Dia 5 → dia 5, dia 6 → dia 6. Útil para imprimir cópia idêntica do mês anterior.</div>
        </div>
      </label>
    </div>

    <div class="modal-actions">
      <button onclick="closeImportModal()">Cancelar</button>
      <button class="primary" onclick="applyImport()">Aplicar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let medicos = [];
const BLOCK = "__BLOCK__";

const months = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho",
"Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

const monthSelect = document.getElementById("monthSelect");
const yearSelect = document.getElementById("yearSelect");

months.forEach((m, i) => {
  monthSelect.innerHTML += `<option value="${i}">${m}</option>`;
});

const currentYear = new Date().getFullYear();
for (let y = currentYear - 1; y <= currentYear + 5; y++) {
  yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
}

monthSelect.value = new Date().getMonth();
yearSelect.value = currentYear;

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute("data-theme");
  html.setAttribute("data-theme", current === "blue" ? "gray" : "blue");
}

function countShifts(name) {
  let c = 0;
  document.querySelectorAll(".cell-select").forEach(s => { if (s.value === name) c++; });
  return c;
}

function renderMedicos() {
  const div = document.getElementById("listaMedicos");
  document.getElementById("counter").innerText = medicos.length;

  if (medicos.length === 0) {
    div.innerHTML = '<div class="empty-state">Adicione médicos para montar a escala</div>';
  } else {
    div.innerHTML = "";
    medicos.forEach((m, i) => {
      const el = document.createElement("div");
      el.className = "medico-item";
      el.innerHTML = `
        <span class="medico-name">${m}</span>
        <span class="medico-count" id="count-${i}">0</span>
        <button class="btn-remove" onclick="removeMedico(${i})" title="Remover">×</button>
      `;
      div.appendChild(el);
    });
  }

  // Se ainda não há tabela criada, gera. Caso contrário, só atualiza as opções.
  const tbody = document.querySelector("#calendar tbody");
  if (!tbody || tbody.children.length === 0) {
    generateCalendar();
  } else {
    updateCellOptions();
  }
}

/* Atualiza apenas as <option> dos selects existentes, preservando valores selecionados */
function updateCellOptions() {
  document.querySelectorAll(".cell-select").forEach(sel => {
    const currentValue = sel.value;

    // Se o médico atualmente selecionado foi removido, limpar a célula
    const stillExists = currentValue === "" || currentValue === BLOCK || medicos.includes(currentValue);

    sel.innerHTML = `
      <option value="">—</option>
      <option value="${BLOCK}">Bloqueado</option>
      ${medicos.map(m => `<option value="${m}">${m}</option>`).join("")}
    `;

    if (stillExists) {
      sel.value = currentValue;
    } else {
      // médico foi removido - limpar e remover classe
      sel.value = "";
      const cell = sel.closest("td");
      if (cell) cell.classList.remove("assigned", "blocked");
    }
  });

  updateCounts();
}

function updateCounts() {
  medicos.forEach((m, i) => {
    const el = document.getElementById(`count-${i}`);
    if (el) el.innerText = countShifts(m);
  });
}

function addMedico() {
  const input = document.getElementById("medicoInput");
  const name = input.value.trim();
  if (name && !medicos.includes(name)) {
    medicos.push(name);
    input.value = "";
    renderMedicos();
  }
  input.focus();
}

function removeMedico(i) {
  medicos.splice(i, 1);
  renderMedicos();
}

function generateCalendar() {
  const month = parseInt(monthSelect.value);
  const year = parseInt(yearSelect.value);

  document.getElementById("monthLabel").innerHTML =
    `<strong>${months[month]}</strong> · ${year}`;

  const tbody = document.querySelector("#calendar tbody");
  tbody.innerHTML = "";

  const firstDay = new Date(year, month, 1);
  const lastDate = new Date(year, month + 1, 0).getDate();

  let startDay = firstDay.getDay();
  startDay = startDay === 0 ? 6 : startDay - 1;

  let row = document.createElement("tr");

  for (let i = 0; i < startDay; i++) {
    const td = document.createElement("td");
    td.classList.add("empty");
    row.appendChild(td);
  }

  for (let day = 1; day <= lastDate; day++) {
    const cell = document.createElement("td");
    const date = new Date(year, month, day);
    const dow = date.getDay();

    if (dow === 0 || dow === 6) cell.classList.add("weekend");

    const options = `
      <option value="">—</option>
      <option value="${BLOCK}">Bloqueado</option>
      ${medicos.map(m => `<option value="${m}">${m}</option>`).join("")}
    `;

    cell.innerHTML = `
      <div class="day">${day}</div>
      <select class="cell-select">${options}</select>
    `;

    const select = cell.querySelector("select");
    select.onchange = () => {
      cell.classList.remove("blocked", "assigned");
      if (select.value === BLOCK) {
        cell.classList.add("blocked");
      } else if (select.value !== "") {
        cell.classList.add("assigned");
      }
      updateCounts();
    };

    row.appendChild(cell);

    if ((startDay + day) % 7 === 0) {
      tbody.appendChild(row);
      row = document.createElement("tr");
    }
  }

  while (row.children.length > 0 && row.children.length < 7) {
    const td = document.createElement("td");
    td.classList.add("empty");
    row.appendChild(td);
  }
  if (row.children.length > 0) tbody.appendChild(row);

  updateCounts();
}

function updateSignatureState() {
  const nameEl = document.querySelector(".signature-name");
  const block = document.getElementById("signatureBlock");
  if (!nameEl || !block) return;

  // Pega só o texto, ignorando <br> e zero-width chars
  const text = (nameEl.innerText || "").replace(/[\u200B-\u200D\uFEFF\s]/g, "");
  const isEmpty = text.length === 0;

  nameEl.setAttribute("data-empty", isEmpty ? "true" : "false");
  block.setAttribute("data-hidden", isEmpty ? "true" : "false");
}

// Inicializar estado da assinatura
document.addEventListener("DOMContentLoaded", updateSignatureState);

function exportPDF() {
  // Garantir que o estado da assinatura está correto antes de imprimir
  updateSignatureState();

  const inserted = [];
  const scheduleData = []; // dados estruturados para o vault

  document.querySelectorAll(".cell-select").forEach(sel => {
    const cell = sel.closest("td");
    const dayEl = cell?.querySelector(".day");
    const day = dayEl ? parseInt(dayEl.innerText) : null;

    // Registrar no vault apenas se há valor (ignorar células vazias e empty)
    if (day && sel.value && sel.value !== "") {
      scheduleData.push({
        d: day,
        v: sel.value === BLOCK ? "__B__" : sel.value
      });
    }

    // Pular dias bloqueados - mostrar apenas a hachura no PDF
    if (sel.value === BLOCK) return;

    if (sel.value && sel.value !== "") {
      const span = document.createElement("div");
      span.className = "print-text";
      span.innerText = sel.value;
      sel.parentNode.appendChild(span);
      inserted.push(span);
    }
  });

  // Pegar título, hospital e dados do coordenador
  const titleEl = document.querySelector(".title");
  const hospitalEl = document.querySelector(".hospital-name");
  const sigNameEl = document.querySelector(".signature-name");
  const sigLabelEl = document.querySelector(".signature-label");

  const titleRaw = (titleEl?.innerText || "Escala Médica").trim();
  const hospitalRaw = (hospitalEl?.innerText || "").trim();

  // Pega nome do coordenador (ignorando zero-width chars do contenteditable)
  const coordName = (sigNameEl?.innerText || "")
    .replace(/[\u200B-\u200D\uFEFF]/g, "")
    .trim();
  const coordLabel = (sigLabelEl?.innerText || "").trim();

  // Sanitizar para nome de arquivo
  const titleText = titleRaw
    .toLowerCase()
    .replace(/\s+/g, "-")
    .replace(/[^\w\u00C0-\u017F-]/g, "")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "")
    || "escala";

  // Construir payload do vault (esteganograma invisível)
  const payload = {
    v: 1, // versão do schema
    t: titleRaw,
    h: hospitalRaw,
    m: parseInt(monthSelect.value),
    y: parseInt(yearSelect.value),
    docs: medicos,
    s: scheduleData,
    c: coordName ? { n: coordName, l: coordLabel } : null
  };

  // Codificar em base64 + delimitadores únicos para extração confiável
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  const vault = document.getElementById("pdfDataVault");
  vault.innerText = `«ESC-START»${encoded}«ESC-END»`;

  const originalTitle = document.title;
  document.title = `${titleText}-${months[monthSelect.value].toLowerCase()}-${yearSelect.value}`;

  setTimeout(() => {
    window.print();
    setTimeout(() => {
      inserted.forEach(s => s.remove());
      vault.innerText = "";
      document.title = originalTitle;
    }, 500);
  }, 100);
}

/* ==================== IMPORTAÇÃO ==================== */
let pendingImport = null;

async function handleImport(event) {
  const file = event.target.files[0];
  event.target.value = ""; // permite reimportar o mesmo arquivo
  if (!file) return;

  if (!window.pdfjsLib) {
    showToast("Biblioteca de leitura de PDF não carregou. Verifique sua conexão.", "error");
    return;
  }

  try {
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

    let fullText = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += content.items.map(item => item.str).join("");
    }

    // Extrair payload entre delimitadores
    const match = fullText.match(/«ESC-START»([A-Za-z0-9+/=]+)«ESC-END»/);
    if (!match) {
      showToast("PDF não contém dados de escala (gerado por outro sistema?)", "error");
      return;
    }

    const decoded = decodeURIComponent(escape(atob(match[1])));
    const payload = JSON.parse(decoded);

    if (!payload.v || !payload.s) {
      showToast("Dados da escala em formato inválido.", "error");
      return;
    }

    pendingImport = payload;
    showImportModal(payload);
  } catch (err) {
    console.error(err);
    showToast("Erro ao ler o PDF: " + err.message, "error");
  }
}

function showImportModal(payload) {
  const meta = document.getElementById("modalMeta");
  const monthName = months[payload.m] || "?";
  const totalAtribs = payload.s.filter(x => x.v !== "__B__").length;
  const totalBloq = payload.s.filter(x => x.v === "__B__").length;

  let coordLine = "";
  if (payload.c && payload.c.n) {
    coordLine = `<div><strong>Coordenador:</strong> ${payload.c.n}${payload.c.l ? " · " + payload.c.l : ""}</div>`;
  }

  meta.innerHTML = `
    <div><strong>Origem:</strong> ${payload.t || "Escala"} — ${monthName} / ${payload.y}</div>
    <div><strong>Médicos:</strong> ${payload.docs.length} (${payload.docs.join(", ") || "—"})</div>
    <div><strong>Plantões registrados:</strong> ${totalAtribs} atribuídos · ${totalBloq} bloqueados</div>
    ${coordLine}
    <div><strong>Aplicar em:</strong> ${months[parseInt(monthSelect.value)]} / ${yearSelect.value}</div>
  `;

  document.getElementById("importModal").classList.add("open");
}

function closeImportModal() {
  document.getElementById("importModal").classList.remove("open");
  pendingImport = null;
}

function applyImport() {
  if (!pendingImport) return;

  const mode = document.querySelector('input[name="importMode"]:checked').value;
  const payload = pendingImport;

  // 1. Importar a lista de médicos (mesclar sem duplicar)
  payload.docs.forEach(doc => {
    if (doc && !medicos.includes(doc)) medicos.push(doc);
  });

  // 1a. Restaurar título e hospital (sempre - são parte da identidade da escala)
  if (payload.t) {
    const titleEl = document.querySelector(".title");
    if (titleEl) titleEl.innerText = payload.t;
  }
  if (payload.h) {
    const hospitalEl = document.querySelector(".hospital-name");
    if (hospitalEl) hospitalEl.innerText = payload.h;
  }

  // 1b. Importar dados do coordenador (apenas se os campos atuais estão vazios)
  if (payload.c && payload.c.n) {
    const sigNameEl = document.querySelector(".signature-name");
    const sigLabelEl = document.querySelector(".signature-label");

    const currentName = (sigNameEl?.innerText || "")
      .replace(/[\u200B-\u200D\uFEFF\s]/g, "");

    if (sigNameEl && currentName.length === 0) {
      sigNameEl.innerText = payload.c.n;
      if (sigLabelEl && payload.c.l) {
        sigLabelEl.innerText = payload.c.l;
      }
      updateSignatureState();
    }
  }

  // 2. Construir índice da escala antiga
  const oldMonth = payload.m;
  const oldYear = payload.y;

  // Mapa: dia(1-31) → valor
  const oldMap = {};
  payload.s.forEach(({d, v}) => { oldMap[d] = v; });

  // 3. Aplicar replicação no mês ATUAL
  const newMonth = parseInt(monthSelect.value);
  const newYear = parseInt(yearSelect.value);
  const newLastDay = new Date(newYear, newMonth + 1, 0).getDate();

  // Renderizar tabela primeiro, depois preencher selects
  renderMedicos();

  let applied = 0;

  if (mode === "exact-date") {
    // Modo simples: dia X → dia X
    for (let d = 1; d <= newLastDay; d++) {
      if (oldMap[d] !== undefined) {
        if (setCellValue(d, oldMap[d])) applied++;
      }
    }
  } else if (mode === "weekday-simple") {
    // Modo simples por dia da semana: pega o último valor visto para cada DOW
    // (preserva caso o último plantão de cada dia da semana seja o "fixo")
    const byDow = {}; // 0-6 → valor
    Object.keys(oldMap).forEach(d => {
      const day = parseInt(d);
      const dow = new Date(oldYear, oldMonth, day).getDay();
      // Sobrescrever - pegamos o último encontrado iterando em ordem
    });
    // Iterar em ordem de dia para garantir que o último vence
    const sortedDays = Object.keys(oldMap).map(Number).sort((a,b) => a-b);
    sortedDays.forEach(day => {
      const dow = new Date(oldYear, oldMonth, day).getDay();
      byDow[dow] = oldMap[day];
    });

    for (let d = 1; d <= newLastDay; d++) {
      const dow = new Date(newYear, newMonth, d).getDay();
      if (byDow[dow] !== undefined) {
        if (setCellValue(d, byDow[dow])) applied++;
      }
    }
  } else {
    // weekday-ordinal (PADRÃO): preserva 1ª segunda → 1ª segunda etc.
    // Mapa: "dow-ordinal" → valor (ex: "1-2" = 2ª segunda)
    const byOrdinal = {};
    Object.keys(oldMap).map(Number).sort((a,b) => a-b).forEach(day => {
      const dow = new Date(oldYear, oldMonth, day).getDay();
      const ordinal = Math.ceil(day / 7);
      byOrdinal[`${dow}-${ordinal}`] = oldMap[day];
    });

    for (let d = 1; d <= newLastDay; d++) {
      const dow = new Date(newYear, newMonth, d).getDay();
      const ordinal = Math.ceil(d / 7);
      const key = `${dow}-${ordinal}`;
      if (byOrdinal[key] !== undefined) {
        if (setCellValue(d, byOrdinal[key])) applied++;
      }
    }
  }

  updateCounts();
  closeImportModal();
  showToast(`Escala importada: ${applied} ${applied === 1 ? "atribuição aplicada" : "atribuições aplicadas"}`, "success");
}

/* Aplica um valor a uma célula específica (dia 1-31) */
function setCellValue(day, value) {
  // Encontrar a célula com .day == day
  const cells = document.querySelectorAll("#calendar tbody td");
  for (const cell of cells) {
    if (cell.classList.contains("empty")) continue;
    const dayEl = cell.querySelector(".day");
    if (dayEl && parseInt(dayEl.innerText) === day) {
      const sel = cell.querySelector(".cell-select");
      if (!sel) return false;

      const realValue = value === "__B__" ? BLOCK : value;

      // Verificar se o valor existe no select (médico pode ter sido removido)
      const optionExists = Array.from(sel.options).some(o => o.value === realValue);
      if (!optionExists) return false;

      sel.value = realValue;
      cell.classList.remove("blocked", "assigned");
      if (realValue === BLOCK) {
        cell.classList.add("blocked");
      } else if (realValue !== "") {
        cell.classList.add("assigned");
      }
      return true;
    }
  }
  return false;
}

/* Toast simples */
let toastTimeout;
function showToast(msg, kind = "") {
  const el = document.getElementById("toast");
  el.className = "toast show" + (kind ? " " + kind : "");
  el.innerText = msg;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    el.classList.remove("show");
  }, 4000);
}

/* Fechar modal ao clicar no backdrop */
document.getElementById("importModal").addEventListener("click", e => {
  if (e.target.id === "importModal") closeImportModal();
});

/* ESC fecha modal */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.getElementById("importModal").classList.contains("open")) {
    closeImportModal();
  }
});

monthSelect.onchange = generateCalendar;
yearSelect.onchange = generateCalendar;

renderMedicos();
