<!DOCTYPE html>
<html lang="pt-br" data-theme="blue" data-mode="simple">
<head>
<meta charset="UTF-8">
<title>Escala Médica</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>

<style>
/* ==================== TEMA AZUL (PADRÃO) ==================== */
:root,
[data-theme="blue"] {
  --bg: #f0f4f8;
  --bg-soft: #e3ecf4;
  --paper: #ffffff;
  --ink: #0f2840;
  --ink-soft: #355068;
  --ink-muted: #7a8fa3;
  --line: #d4dfeb;
  --line-soft: #e8eef5;
  --accent: #0a6cb8;
  --accent-deep: #074d83;
  --accent-soft: #dceaf7;
  --weekend: #f4f8fc;
  --day-color: #0a6cb8;
  --block-stripe: rgba(10, 108, 184, 0.16);
  --shift: #0d7a5f;
  --shift-soft: #d6ebe3;
}

/* ==================== TEMA CINZA ==================== */
[data-theme="gray"] {
  --bg: #f5f6f8;
  --bg-soft: #eceef2;
  --paper: #ffffff;
  --ink: #1f2937;
  --ink-soft: #4b5563;
  --ink-muted: #9ca3af;
  --line: #e2e5ea;
  --line-soft: #eef0f3;
  --accent: #4b5563;
  --accent-deep: #1f2937;
  --accent-soft: #e5e7eb;
  --weekend: #f7f8fa;
  --day-color: #374151;
  --block-stripe: rgba(75, 85, 99, 0.18);
  --shift: #374151;
  --shift-soft: #e5e7eb;
}

/* ==================== TEMA VERDE ==================== */
[data-theme="green"] {
  --bg: #f0f6f3;
  --bg-soft: #e0ece5;
  --paper: #ffffff;
  --ink: #0f2820;
  --ink-soft: #2f5347;
  --ink-muted: #82a397;
  --line: #d2e2da;
  --line-soft: #e6efea;
  --accent: #1f7a5a;
  --accent-deep: #155841;
  --accent-soft: #d6ebe2;
  --weekend: #f4f9f6;
  --day-color: #1f7a5a;
  --block-stripe: rgba(31, 122, 90, 0.16);
  --shift: #2563a8;
  --shift-soft: #dbe7f3;
}

/* ==================== TEMA TEAL ==================== */
[data-theme="teal"] {
  --bg: #eff5f6;
  --bg-soft: #dde9eb;
  --paper: #ffffff;
  --ink: #0e2a30;
  --ink-soft: #2c5159;
  --ink-muted: #7d9aa0;
  --line: #cfdfe2;
  --line-soft: #e3eced;
  --accent: #0e7490;
  --accent-deep: #0a5364;
  --accent-soft: #d2eaee;
  --weekend: #f3f8f9;
  --day-color: #0e7490;
  --block-stripe: rgba(14, 116, 144, 0.16);
  --shift: #1f6f5c;
  --shift-soft: #d6e9e2;
}

/* ==================== TEMA ÍNDIGO ==================== */
[data-theme="indigo"] {
  --bg: #f1f1f9;
  --bg-soft: #e2e3f0;
  --paper: #ffffff;
  --ink: #1c1d3a;
  --ink-soft: #3e3f6b;
  --ink-muted: #8b8da6;
  --line: #d6d7e6;
  --line-soft: #e8e9f1;
  --accent: #4338ca;
  --accent-deep: #2f269a;
  --accent-soft: #e0deef;
  --weekend: #f5f5fb;
  --day-color: #4338ca;
  --block-stripe: rgba(67, 56, 202, 0.15);
  --shift: #1f7a5a;
  --shift-soft: #d6ebe2;
}

/* ==================== TEMA SLATE ==================== */
[data-theme="slate"] {
  --bg: #f1f4f7;
  --bg-soft: #e2e7ee;
  --paper: #ffffff;
  --ink: #1a2332;
  --ink-soft: #3a485c;
  --ink-muted: #8595a8;
  --line: #d4dbe5;
  --line-soft: #e8ecf1;
  --accent: #475569;
  --accent-deep: #2c3849;
  --accent-soft: #dde2e9;
  --weekend: #f5f7fa;
  --day-color: #334155;
  --block-stripe: rgba(71, 85, 105, 0.18);
  --shift: #475569;
  --shift-soft: #e1e6ec;
}

/* ==================== TEMA VINHO ==================== */
[data-theme="wine"] {
  --bg: #f7f1f3;
  --bg-soft: #ebdfe3;
  --paper: #ffffff;
  --ink: #2c1218;
  --ink-soft: #5a3038;
  --ink-muted: #a08891;
  --line: #e3d5d9;
  --line-soft: #f0e7ea;
  --accent: #9d2548;
  --accent-deep: #6e1832;
  --accent-soft: #f0d9e0;
  --weekend: #faf4f6;
  --day-color: #9d2548;
  --block-stripe: rgba(157, 37, 72, 0.14);
  --shift: #475569;
  --shift-soft: #dde2e9;
}

/* ==================== TEMA BRONZE ==================== */
[data-theme="bronze"] {
  --bg: #f6f3ee;
  --bg-soft: #ebe5d8;
  --paper: #ffffff;
  --ink: #2c2218;
  --ink-soft: #5a4838;
  --ink-muted: #a8957c;
  --line: #e3dccc;
  --line-soft: #f0ebe0;
  --accent: #a06322;
  --accent-deep: #714417;
  --accent-soft: #ecdfca;
  --weekend: #faf6ee;
  --day-color: #a06322;
  --block-stripe: rgba(160, 99, 34, 0.16);
  --shift: #475569;
  --shift-soft: #dde2e9;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background 0.25s ease, color 0.25s ease;
}

body { display: flex; min-height: 100vh; }

/* ==================== SIDEBAR ==================== */
.sidebar {
  width: 260px;
  background: var(--paper);
  border-right: 1px solid var(--line);
  padding: 22px 18px;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  transition: background 0.25s ease, border-color 0.25s ease;
}

.sidebar h3 {
  font-family: "IBM Plex Sans", sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin: 0 0 14px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.count-badge {
  background: var(--bg-soft);
  color: var(--ink-soft);
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  font-family: "IBM Plex Mono", monospace;
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}

.sidebar input[type="text"] {
  padding: 9px 12px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--paper);
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
  transition: all 0.15s ease;
}

.sidebar input[type="text"]:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.btn-add {
  padding: 9px 12px;
  border-radius: 6px;
  border: none;
  background: var(--accent);
  color: white;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  transition: background 0.15s ease;
}

.btn-add:hover { background: var(--accent-deep); }

.sidebar-list {
  margin-top: 4px;
  overflow-y: auto;
  flex: 1;
  margin-right: -8px;
  padding-right: 8px;
}

.sidebar-list::-webkit-scrollbar { width: 6px; }
.sidebar-list::-webkit-scrollbar-track { background: transparent; }
.sidebar-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.medico-item {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 8px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  transition: all 0.15s ease;
}

.medico-item:hover { border-color: var(--ink-muted); }

.medico-name {
  flex: 1;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.medico-count {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  color: var(--ink-muted);
  background: var(--bg-soft);
  padding: 2px 6px;
  border-radius: 10px;
  margin-right: 6px;
  min-width: 22px;
  text-align: center;
}

.btn-remove {
  background: transparent;
  border: none;
  color: var(--ink-muted);
  cursor: pointer;
  width: 22px;
  height: 22px;
  border-radius: 4px;
  display: grid;
  place-items: center;
  font-size: 16px;
  padding: 0;
  transition: all 0.15s ease;
  line-height: 1;
}

.btn-remove:hover {
  background: #fee2e2;
  color: #b91c1c;
}

.empty-state {
  text-align: center;
  padding: 24px 12px;
  color: var(--ink-muted);
  font-size: 12px;
  border: 1px dashed var(--line);
  border-radius: 8px;
}

/* THEME PICKER */
.theme-switch {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--line-soft);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.theme-label {
  font-family: "IBM Plex Mono", monospace;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-muted);
}

.theme-picker {
  position: relative;
  flex-shrink: 0;
}

.theme-current {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--paper);
  border: 1px solid var(--line);
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
  transition: all 0.15s ease;
}

.theme-current:hover {
  border-color: var(--ink-muted);
  transform: scale(1.05);
}

.theme-current-swatch {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  background: var(--accent);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.06);
  transition: background 0.2s;
}

.theme-palette {
  position: fixed;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  box-shadow: 0 8px 24px rgba(15,23,42,0.12), 0 2px 6px rgba(15,23,42,0.06);
  opacity: 0;
  pointer-events: none;
  transform: translateY(4px) scale(0.96);
  transition: opacity 0.15s ease, transform 0.15s ease;
  z-index: 9999;
}

.theme-palette.open {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}

.theme-opt {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  border: 2px solid transparent;
  cursor: pointer;
  padding: 0;
  position: relative;
  transition: all 0.12s ease;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.08) inset;
}

.theme-opt:hover {
  transform: scale(1.1);
}

.theme-opt[data-active="true"] {
  border-color: var(--ink);
  transform: scale(1.05);
}

.theme-opt[data-active="true"]::after {
  content: '';
  position: absolute;
  inset: 50% 50% auto auto;
  width: 10px;
  height: 10px;
  background: white;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 0 2px var(--ink);
}

/* Picker group: design + cor lado a lado */
.picker-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Design picker: paleta com ícones miniatura */
.design-palette {
  grid-template-columns: repeat(5, 1fr) !important;
  width: 240px;
}

.design-opt {
  width: 38px;
  height: 38px;
  border-radius: 6px;
  border: 2px solid transparent;
  cursor: pointer;
  padding: 4px;
  background: var(--paper);
  transition: all 0.12s ease;
  display: grid;
  place-items: center;
  position: relative;
  box-shadow: 0 0 0 1px var(--line) inset;
}

.design-opt:hover {
  transform: scale(1.06);
  box-shadow: 0 0 0 1px var(--ink-muted) inset;
}

.design-opt[data-active="true"] {
  border-color: var(--ink);
  box-shadow: 0 0 0 1px var(--ink) inset;
}

/* Ícones miniatura (28x28) representando cada design */
.design-icon {
  width: 26px;
  height: 26px;
  display: block;
  position: relative;
  border-radius: 3px;
}

/* Padrão: grade 3x3 com bordas finas */
.design-icon-default {
  background:
    linear-gradient(to right, transparent 0 33%, var(--ink-muted) 33% 34%, transparent 34% 66%, var(--ink-muted) 66% 67%, transparent 67%) repeat,
    linear-gradient(to bottom, transparent 0 33%, var(--ink-muted) 33% 34%, transparent 34% 66%, var(--ink-muted) 66% 67%, transparent 67%) repeat;
  border: 1px solid var(--ink-muted);
}

/* Cards: 4 quadradinhos com sombra */
.design-icon-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 3px;
  padding: 1px;
}
.design-icon-cards::before,
.design-icon-cards::after {
  content: '';
  background: var(--ink-muted);
  border-radius: 2px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
.design-icon-cards {
  background:
    linear-gradient(var(--ink-muted), var(--ink-muted)) top left / calc(50% - 1.5px) calc(50% - 1.5px) no-repeat,
    linear-gradient(var(--ink-muted), var(--ink-muted)) top right / calc(50% - 1.5px) calc(50% - 1.5px) no-repeat,
    linear-gradient(var(--ink-muted), var(--ink-muted)) bottom left / calc(50% - 1.5px) calc(50% - 1.5px) no-repeat,
    linear-gradient(var(--ink-muted), var(--ink-muted)) bottom right / calc(50% - 1.5px) calc(50% - 1.5px) no-repeat;
}

/* Compacto: zebra com header escuro */
.design-icon-compact {
  background:
    linear-gradient(to bottom,
      var(--ink) 0 25%,
      var(--paper) 25% 50%,
      var(--bg-soft) 50% 75%,
      var(--paper) 75% 100%);
  border: 1px solid var(--ink-muted);
}

/* Linhas: só linhas horizontais */
.design-icon-lines {
  background:
    linear-gradient(to bottom,
      var(--ink) 0 2px,
      transparent 2px 9px,
      var(--ink-muted) 9px 10px,
      transparent 10px 17px,
      var(--ink-muted) 17px 18px,
      transparent 18px 24px,
      var(--ink) 24px 26px);
}

/* Boxed: borda grossa com células separadas */
.design-icon-boxed {
  background:
    linear-gradient(var(--paper), var(--paper)) center / calc(100% - 8px) calc(100% - 8px) no-repeat;
  border: 2px solid var(--ink);
  position: relative;
}
.design-icon-boxed::before {
  content: '';
  position: absolute;
  inset: 4px;
  background:
    linear-gradient(var(--ink-muted), var(--ink-muted)) top left / calc(50% - 1px) calc(50% - 1px) no-repeat,
    linear-gradient(var(--ink-muted), var(--ink-muted)) top right / calc(50% - 1px) calc(50% - 1px) no-repeat,
    linear-gradient(var(--ink-muted), var(--ink-muted)) bottom left / calc(50% - 1px) calc(50% - 1px) no-repeat,
    linear-gradient(var(--ink-muted), var(--ink-muted)) bottom right / calc(50% - 1px) calc(50% - 1px) no-repeat;
}

/* ==================== MAIN ==================== */
.container {
  flex: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px 36px 50px;
}

.header {
  text-align: center;
  margin-bottom: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.hospital-name {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
  outline: none;
  cursor: text;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px dashed transparent;
  transition: all 0.15s ease;
  display: inline-block;
}

.hospital-name:hover {
  border-color: var(--line);
  background: var(--paper);
}

.hospital-name:focus {
  border-color: var(--accent);
  background: var(--paper);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.title {
  font-family: "IBM Plex Sans", sans-serif;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink);
  outline: none;
  cursor: text;
  padding: 4px 10px;
  border-radius: 5px;
  border: 1px dashed transparent;
  transition: all 0.15s ease;
  display: inline-block;
  margin: 0;
  line-height: 1.2;
}

.title:hover {
  border-color: var(--line);
  background: var(--paper);
}

.title:focus {
  border-color: var(--accent);
  background: var(--paper);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.month-label {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  color: var(--ink-muted);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-top: 10px;
}

.month-label strong {
  color: var(--ink);
  font-weight: 500;
}

.controls {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
}

.select-wrap { position: relative; }

.select-wrap::after {
  content: '▾';
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  color: var(--ink-muted);
  pointer-events: none;
}

select {
  appearance: none;
  -webkit-appearance: none;
  padding: 8px 30px 8px 12px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--paper);
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
}

select:hover { border-color: var(--ink-muted); }
select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.btn-pdf {
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: white;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: all 0.15s ease;
}

.btn-pdf:hover {
  background: var(--accent-deep);
  border-color: var(--accent-deep);
}

.btn-pdf svg { width: 13px; height: 13px; }

/* Botão secundário (importar) */
.btn-import {
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink-soft);
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: all 0.15s ease;
}

.btn-import:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--paper);
}

.btn-import svg { width: 13px; height: 13px; }

/* Esteganograma - dados invisíveis embutidos no PDF */
.pdf-data-vault {
  position: absolute;
  bottom: 2mm;
  left: 2mm;
  right: 2mm;
  font-family: monospace;
  font-size: 1px;
  line-height: 1;
  color: white;
  word-break: break-all;
  pointer-events: none;
  user-select: none;
  z-index: -1;
  display: none;
}

@media print {
  .pdf-data-vault {
    display: block !important;
    color: #fefefe !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}

/* Modal de importação */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(2px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}

.modal-backdrop.open { display: flex; }

.modal {
  background: var(--paper);
  border-radius: 10px;
  border: 1px solid var(--line);
  box-shadow: 0 20px 60px rgba(15, 23, 42, 0.2);
  max-width: 480px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
}

.modal h2 {
  margin: 0 0 6px 0;
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
}

.modal-subtitle {
  font-size: 13px;
  color: var(--ink-muted);
  margin-bottom: 18px;
}

.modal-meta {
  background: var(--bg-soft);
  border-radius: 6px;
  padding: 10px 12px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 11.5px;
  color: var(--ink-soft);
  margin-bottom: 18px;
  line-height: 1.7;
}

.modal-meta strong {
  color: var(--ink);
  font-weight: 600;
}

.modal-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}

.modal-option {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.modal-option:hover {
  border-color: var(--accent);
  background: var(--bg-soft);
}

.modal-option input[type="radio"] {
  margin-top: 3px;
  accent-color: var(--accent);
  cursor: pointer;
}

.modal-option-content { flex: 1; }
.modal-option-title {
  font-weight: 600;
  font-size: 13px;
  color: var(--ink);
  margin-bottom: 2px;
}
.modal-option-desc {
  font-size: 12px;
  color: var(--ink-muted);
  line-height: 1.4;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.modal-actions button {
  padding: 8px 16px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink-soft);
  transition: all 0.15s ease;
}

.modal-actions button:hover { border-color: var(--ink-muted); }

.modal-actions button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.modal-actions button.primary:hover {
  background: var(--accent-deep);
  border-color: var(--accent-deep);
}

/* Toast de feedback */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--ink);
  color: white;
  padding: 12px 18px;
  border-radius: 6px;
  font-size: 13px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  z-index: 200;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.25s ease;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

.toast.error { background: #b91c1c; }
.toast.success { background: #0d7a5f; }

.legend {
  display: flex;
  gap: 16px;
  margin-bottom: 14px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-muted);
  justify-content: center;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-swatch {
  width: 13px;
  height: 13px;
  border-radius: 3px;
  border: 1px solid var(--line);
}

.legend-swatch.weekend { background: var(--weekend); }
.legend-swatch.blocked-sw {
  background-image: repeating-linear-gradient(45deg, var(--block-stripe), var(--block-stripe) 3px, transparent 3px, transparent 6px);
  background-color: var(--paper);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
.legend-swatch.assigned {
  background: var(--paper);
  border: 1px solid var(--shift);
  position: relative;
}
.legend-swatch.assigned::after {
  content: '';
  position: absolute;
  inset: 2px;
  border: 1px solid var(--shift);
  border-radius: 1px;
}

.legend-shifts { display: none; }
[data-mode="advanced"] .legend-shifts { display: flex; }
[data-mode="advanced"] .legend-item:has(.assigned),
[data-mode="advanced"] .legend-item:has(.blocked-sw) { display: none; }

.legend-shift-tag {
  width: 16px;
  height: 16px;
  border-radius: 3px;
  color: white;
  font-family: "IBM Plex Mono", monospace;
  font-size: 8.5px;
  font-weight: 700;
  display: inline-grid;
  place-items: center;
}

.calendar-wrap {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

thead th {
  background: var(--bg-soft);
  border-bottom: 1px solid var(--line);
  padding: 10px 6px;
  font-family: "IBM Plex Sans", sans-serif;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-soft);
  text-align: center;
}

thead th:not(:last-child) { border-right: 1.5px solid var(--line); }

tbody td {
  border-right: 1.5px solid var(--line);
  border-bottom: 1.5px solid var(--line);
  height: 88px;
  position: relative;
  padding: 6px;
  vertical-align: top;
  background: var(--paper);
  transition: background 0.15s ease;
}

tbody tr:last-child td { border-bottom: none; }
tbody td:last-child { border-right: none; }

tbody td.empty {
  background: var(--bg-soft);
}

.day {
  position: absolute;
  top: 6px;
  right: 10px;
  color: var(--day-color);
  font-weight: 600;
  font-size: 14px;
  font-family: "IBM Plex Sans", sans-serif;
}

.weekend { background-color: var(--weekend); }

.cell-select {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  appearance: none;
  -webkit-appearance: none;
  padding: 5px 8px;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--paper);
  font-family: inherit;
  font-size: 11.5px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
}

.cell-select:hover {
  border-color: var(--ink-muted);
}

.cell-select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

td.assigned { background: var(--paper); }

td.assigned .cell-select {
  background: var(--paper);
  border-color: var(--shift);
  color: #374151;
  font-weight: 600;
}

td.weekend.assigned { background: var(--weekend); }

td.blocked {
  background-image: repeating-linear-gradient(
    45deg,
    var(--block-stripe),
    var(--block-stripe) 4px,
    transparent 4px,
    transparent 9px
  );
}

td.weekend.blocked {
  background-color: var(--weekend);
  background-image: repeating-linear-gradient(
    45deg,
    var(--block-stripe),
    var(--block-stripe) 4px,
    transparent 4px,
    transparent 9px
  );
}

td.blocked .cell-select {
  background: var(--paper);
  color: var(--accent-deep);
  border-color: var(--accent);
  font-weight: 600;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.08em;
}

td:hover:not(.empty) {
  background-color: var(--line-soft);
}

td.weekend:hover:not(.empty) {
  filter: brightness(0.97);
}

td.blocked:hover:not(.empty) { filter: brightness(0.97); }

/* ===== BLOQUEADO em designs customizados ===== */
/* Nos designs Cards/Compacto/Linhas/Boxed, o background da célula sobrescreve
   a hachura. Usamos um overlay com sombreamento sutil em vez da hachura. */
[data-style="cards"] td.blocked,
[data-style="compact"] td.blocked,
[data-style="lines"] td.blocked,
[data-style="boxed"] td.blocked {
  background-image: none !important;
  position: relative;
}

[data-style="cards"] td.blocked::after,
[data-style="compact"] td.blocked::after,
[data-style="lines"] td.blocked::after,
[data-style="boxed"] td.blocked::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--ink);
  opacity: 0.18;
  pointer-events: none;
  z-index: 0;
  border-radius: inherit;
}

/* Garantir que conteúdo (.day, .cell-select, .shifts) fique acima do overlay */
[data-style="cards"] td.blocked .day,
[data-style="compact"] td.blocked .day,
[data-style="lines"] td.blocked .day,
[data-style="boxed"] td.blocked .day,
[data-style="cards"] td.blocked .cell-select,
[data-style="compact"] td.blocked .cell-select,
[data-style="lines"] td.blocked .cell-select,
[data-style="boxed"] td.blocked .cell-select,
[data-style="cards"] td.blocked .shifts,
[data-style="compact"] td.blocked .shifts,
[data-style="lines"] td.blocked .shifts,
[data-style="boxed"] td.blocked .shifts,
[data-style="cards"] td.blocked .day-corner,
[data-style="compact"] td.blocked .day-corner,
[data-style="lines"] td.blocked .day-corner,
[data-style="boxed"] td.blocked .day-corner {
  z-index: 1;
}

/* ==================== DESIGN: CARDS ==================== */
/* Cada dia é um card flutuante com sombra */
[data-style="cards"] .header { text-align: center; }
[data-style="cards"] .title {
  font-family: "Lora", Georgia, serif !important;
  font-weight: 600 !important;
  letter-spacing: -0.01em;
}
[data-style="cards"] .hospital-name {
  font-family: "Lora", Georgia, serif;
  font-style: italic;
  letter-spacing: 0.02em;
  text-transform: none;
  font-weight: 500;
}
[data-style="cards"] .month-label {
  text-align: left;
}
[data-style="cards"] .legend {
  justify-content: flex-start;
  gap: 6px;
}
[data-style="cards"] .legend-item {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 5px 10px;
  border-radius: 999px;
  box-shadow: 0 1px 2px rgba(15,23,42,0.04);
  text-transform: none;
  letter-spacing: 0.04em;
  font-size: 10.5px;
  font-family: "IBM Plex Sans", sans-serif;
}
[data-style="cards"] .calendar-wrap {
  border: none !important;
  background: transparent;
  border-radius: 0;
}
[data-style="cards"] table {
  border-spacing: 6px;
  border-collapse: separate;
}
[data-style="cards"] thead th {
  background: transparent;
  border: none !important;
  font-size: 10px;
  padding: 4px 6px 8px;
  color: var(--ink-muted);
  font-family: "Lora", Georgia, serif;
  font-style: italic;
  text-transform: none;
  font-weight: 500;
  letter-spacing: 0.02em;
}
[data-style="cards"] tbody td {
  border: 1px solid var(--line-soft) !important;
  border-radius: 8px;
  background: var(--paper);
  box-shadow: 0 1px 3px rgba(15,23,42,0.04), 0 1px 2px rgba(15,23,42,0.03);
  transition: all 0.18s ease;
}
[data-style="cards"] tbody td:hover:not(.empty) {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(15,23,42,0.08), 0 2px 4px rgba(15,23,42,0.04);
  border-color: var(--accent-soft);
}
[data-style="cards"] tbody td.empty {
  background: transparent;
  border: 1px dashed var(--line-soft) !important;
  box-shadow: none;
}
[data-style="cards"] tbody tr:last-child td { border-bottom: 1px solid var(--line-soft) !important; }
[data-style="cards"] tbody td:last-child { border-right: 1px solid var(--line-soft) !important; }

/* ==================== DESIGN: COMPACTO (zebra) ==================== */
[data-style="compact"] .header {
  text-align: left;
  align-items: flex-start !important;
}
[data-style="compact"] .title {
  font-family: "IBM Plex Mono", monospace !important;
  font-weight: 700 !important;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-size: 22px;
}
[data-style="compact"] .hospital-name {
  font-family: "IBM Plex Mono", monospace;
  letter-spacing: 0.18em;
  font-weight: 500;
}
[data-style="compact"] .month-label { text-align: left; }
[data-style="compact"] .legend {
  display: none !important;
}
[data-style="compact"] .calendar-wrap {
  border: 1px solid var(--line);
  border-radius: 6px;
}
[data-style="compact"] thead th {
  font-size: 10px;
  padding: 8px 4px;
  background: var(--ink);
  color: var(--paper);
  border: none !important;
  letter-spacing: 0.16em;
  font-family: "IBM Plex Mono", monospace;
  font-weight: 500;
}
[data-style="compact"] tbody td {
  border: none !important;
  border-bottom: 1px solid var(--line-soft) !important;
}
[data-style="compact"] tbody tr:nth-child(even) td:not(.empty) {
  background: var(--bg-soft);
}
[data-style="compact"] tbody tr:nth-child(even) td.weekend:not(.empty) {
  background: var(--weekend);
  filter: brightness(0.97);
}
[data-style="compact"] tbody tr:last-child td { border-bottom: none !important; }

/* ==================== DESIGN: LINHAS (minimalista) ==================== */
[data-style="lines"] .header {
  text-align: left;
  align-items: flex-start !important;
}
[data-style="lines"] .title {
  font-weight: 700 !important;
  font-size: 30px;
  letter-spacing: -0.025em;
  border-bottom: 3px solid var(--ink);
  display: inline-block !important;
  padding-bottom: 4px !important;
}
[data-style="lines"] .hospital-name {
  font-weight: 400;
  letter-spacing: 0.22em;
  font-size: 11px;
}
[data-style="lines"] .month-label {
  text-align: left;
  border-top: 1px solid var(--line);
  padding-top: 8px;
  display: block;
  width: 100%;
}
[data-style="lines"] .legend {
  justify-content: flex-start;
  border-bottom: 1px solid var(--line);
  padding-bottom: 8px;
  font-size: 9.5px;
  color: var(--ink-muted);
  text-transform: none;
  letter-spacing: 0.04em;
  font-family: "IBM Plex Sans", sans-serif;
  font-style: italic;
  gap: 0 !important;
}
[data-style="lines"] .legend-item {
  padding: 0 14px;
  border-right: 1px solid var(--line);
}
[data-style="lines"] .legend-item:first-child { padding-left: 0; }
[data-style="lines"] .legend-item:last-child { border-right: none; }
[data-style="lines"] .calendar-wrap {
  border: none;
  background: transparent;
}
[data-style="lines"] thead th {
  background: transparent;
  border: none !important;
  border-bottom: 2px solid var(--ink) !important;
  color: var(--ink);
  padding: 12px 6px;
  font-family: "IBM Plex Sans", sans-serif;
  font-weight: 700;
  letter-spacing: 0.2em;
  font-size: 10px;
  text-align: left;
  padding-left: 10px;
}
[data-style="lines"] tbody td {
  border-right: none !important;
  border-bottom: 1px solid var(--line) !important;
  background: transparent;
  padding-right: 12px !important;
  padding-left: 12px !important;
}
[data-style="lines"] tbody td.empty {
  background: transparent;
}
[data-style="lines"] tbody td.weekend {
  background-color: transparent;
  position: relative;
}
[data-style="lines"] tbody td.weekend::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--weekend);
  opacity: 0.6;
  z-index: 0;
  pointer-events: none;
}
[data-style="lines"] tbody td > * { position: relative; z-index: 1; }
[data-style="lines"] tbody tr:last-child td { border-bottom: 2px solid var(--ink) !important; }

/* ==================== DESIGN: BOXED (poster) ==================== */
[data-style="boxed"] .header { text-align: center; }
[data-style="boxed"] .title {
  font-weight: 800 !important;
  font-size: 32px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
[data-style="boxed"] .hospital-name {
  font-weight: 600;
  letter-spacing: 0.28em;
  font-size: 12px;
  border-top: 1px solid var(--accent);
  border-bottom: 1px solid var(--accent);
  padding: 4px 12px !important;
  display: inline-block;
}
[data-style="boxed"] .month-label {
  background: var(--ink);
  color: var(--paper);
  display: inline-block;
  padding: 4px 12px;
  border-radius: 0;
  letter-spacing: 0.2em;
}
[data-style="boxed"] .month-label strong { color: var(--paper); }
[data-style="boxed"] .legend {
  display: none !important;
}
[data-style="boxed"] .calendar-wrap {
  border: 3px solid var(--ink) !important;
  border-radius: 0;
  padding: 4px;
  background: var(--ink);
}
[data-style="boxed"] table {
  border-spacing: 4px;
  border-collapse: separate;
}
[data-style="boxed"] thead th {
  background: var(--accent);
  color: white;
  border: none !important;
  font-weight: 700;
  font-size: 11px;
  padding: 12px 4px;
  letter-spacing: 0.16em;
  font-family: "IBM Plex Sans", sans-serif;
}
[data-style="boxed"] tbody td {
  border: none !important;
  background: var(--paper);
  border-radius: 4px;
}
[data-style="boxed"] tbody td.empty {
  background: var(--ink-soft);
  opacity: 0.4;
}
[data-style="boxed"] tbody td.weekend {
  background: var(--weekend);
}
[data-style="boxed"] .day {
  font-weight: 700;
}

/* ==================== MODO AVANÇADO (turnos M/T/N) ==================== */
[data-mode="advanced"] tbody td {
  height: auto;
  min-height: 140px;
  padding: 22px 4px 6px;
  vertical-align: top;
}

[data-mode="advanced"] .day {
  top: 4px;
  right: 8px;
  font-size: 13px;
}

[data-mode="advanced"] .cell-select { display: none; }

.shifts {
  display: none;
  flex-direction: column;
  gap: 3px;
  margin-top: 0;
}

[data-mode="advanced"] .shifts { display: flex; }

.shift {
  display: grid;
  grid-template-columns: 16px 1fr;
  align-items: stretch;
  gap: 0;
  border-radius: 4px;
  background: var(--bg-soft);
  overflow: hidden;
  border: 1px solid var(--line-soft);
  min-height: 20px;
}

.shift-tag {
  font-family: "IBM Plex Mono", monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: white;
  display: grid;
  place-items: center;
}

.shift[data-shift="M"] .shift-tag { background: #2f8f6f; }   /* manhã - verde sálvia */
.shift[data-shift="T"] .shift-tag { background: #3a7ab8; }   /* tarde - azul aço */
.shift[data-shift="N"] .shift-tag { background: #6b5b9e; }   /* noite - roxo lavanda */

.shift-slots {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--paper);
  padding: 1px;
}

.shift-select {
  appearance: none;
  -webkit-appearance: none;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 10.5px;
  color: var(--ink);
  padding: 2px 5px;
  cursor: pointer;
  border-radius: 2px;
  transition: background 0.12s;
  outline: none;
  min-height: 17px;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  width: 100%;
}

.shift-select:hover { background: var(--bg-soft); }
.shift-select:focus { background: var(--accent-soft); }
.shift-select.has-value { font-weight: 600; color: #374151; }
.shift-select.is-block {
  color: var(--accent-deep);
  font-weight: 700;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* Bloco da célula inteira no modo avançado quando bloqueada */
[data-mode="advanced"] td.fully-blocked {
  background-image: repeating-linear-gradient(
    45deg,
    var(--block-stripe),
    var(--block-stripe) 4px,
    transparent 4px,
    transparent 9px
  );
}

[data-mode="advanced"] td.fully-blocked .shifts {
  opacity: 0.35;
  pointer-events: none;
}

/* ==================== CONTROLE DE MODO NO SIDEBAR ==================== */
.mode-control {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--line-soft);
}

.mode-control-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.mode-label {
  font-family: "IBM Plex Mono", monospace;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-muted);
}

.mode-toggle {
  display: inline-flex;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2px;
  overflow: hidden;
}

.mode-toggle button {
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  padding: 4px 10px;
  cursor: pointer;
  color: var(--ink-muted);
  border-radius: 4px;
  transition: all 0.15s;
}

.mode-toggle button.active {
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}

.slots-control {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

[data-mode="advanced"] .slots-control { display: flex; }

.slots-stepper {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2px;
}

.slots-stepper button {
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  width: 22px;
  height: 22px;
  cursor: pointer;
  color: var(--accent);
  border-radius: 3px;
  display: grid;
  place-items: center;
  line-height: 1;
}

.slots-stepper button:hover:not(:disabled) { background: var(--accent-soft); }
.slots-stepper button:disabled { color: var(--ink-muted); cursor: not-allowed; opacity: 0.5; }

.slots-stepper-value {
  min-width: 16px;
  text-align: center;
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
}

/* PDF/print do modo avançado */
/* ==================== ASSINATURA ==================== */
.signature {
  margin-top: 80px;
  max-width: 320px;
  padding-top: 8px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.signature-line {

.signature-name:hover {

}

.signature-name:focus {

  background: var(--paper);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

}

.signature-label {

.signature-label:hover {

.signature-label:focus {

<script>
let medicos = [];
const BLOCK = "__BLOCK__";

const months = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho",
"Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

const monthSelect = document.getElementById("monthSelect");
const yearSelect = document.getElementById("yearSelect");

months.forEach((m, i) => {
  monthSelect.innerHTML += `<option value="${i}">${m}</option>`;
});

const currentYear = new Date().getFullYear();
for (let y = currentYear - 1; y <= currentYear + 5; y++) {
  yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
}

monthSelect.value = new Date().getMonth();
yearSelect.value = currentYear;

function positionPalette(palette, button) {
  const rect = button.getBoundingClientRect();
  // Mostrar temporariamente para medir
  const wasOpen = palette.classList.contains("open");
  if (!wasOpen) {
    palette.style.visibility = "hidden";
    palette.classList.add("open");
  }
  const paletteRect = palette.getBoundingClientRect();
  if (!wasOpen) {
    palette.classList.remove("open");
    palette.style.visibility = "";
  }

  // Posicionar acima do botão, alinhado pela direita
  const top = rect.top - paletteRect.height - 8;
  let left = rect.right - paletteRect.width;

  // Garantir que não saia da viewport
  if (left < 8) left = 8;
  if (left + paletteRect.width > window.innerWidth - 8) {
    left = window.innerWidth - paletteRect.width - 8;
  }

  palette.style.top = top + "px";
  palette.style.left = left + "px";
}

function toggleThemePalette(event) {
  event?.stopPropagation();
  const palette = document.getElementById("themePalette");
  const button = document.getElementById("themeCurrentBtn");
  document.getElementById("designPalette")?.classList.remove("open");

  if (palette.classList.contains("open")) {
    palette.classList.remove("open");
    button.setAttribute("aria-expanded", "false");
  } else {
    positionPalette(palette, button);
    palette.classList.add("open");
    button.setAttribute("aria-expanded", "true");
  }
}

function selectTheme(themeName) {
  document.documentElement.setAttribute("data-theme", themeName);
  document.querySelectorAll(".theme-opt").forEach(btn => {
    btn.setAttribute("data-active", btn.dataset.color === themeName ? "true" : "false");
  });
  document.getElementById("themePalette").classList.remove("open");
  document.getElementById("themeCurrentBtn").setAttribute("aria-expanded", "false");
}

function toggleDesignPalette(event) {
  event?.stopPropagation();
  const palette = document.getElementById("designPalette");
  const button = document.getElementById("designCurrentBtn");
  document.getElementById("themePalette")?.classList.remove("open");

  if (palette.classList.contains("open")) {
    palette.classList.remove("open");
    button.setAttribute("aria-expanded", "false");
  } else {
    positionPalette(palette, button);
    palette.classList.add("open");
    button.setAttribute("aria-expanded", "true");
  }
}

function selectDesign(styleName) {
  if (styleName === "default") {
    document.documentElement.removeAttribute("data-style");
  } else {
    document.documentElement.setAttribute("data-style", styleName);
  }
  document.querySelectorAll(".design-opt").forEach(btn => {
    btn.setAttribute("data-active", btn.dataset.style === styleName ? "true" : "false");
  });
  // Atualizar ícone do botão atual
  updateDesignCurrentIcon(styleName);
  document.getElementById("designPalette").classList.remove("open");
  document.getElementById("designCurrentBtn").setAttribute("aria-expanded", "false");
}

function updateDesignCurrentIcon(styleName) {
  const icon = document.getElementById("designCurrentIcon");
  if (!icon) return;
  // Remove classes antigas e aplica a nova
  icon.className = "design-icon design-icon-" + (styleName || "default");
}

// Fechar paletas ao clicar fora
document.addEventListener("click", (e) => {
  if (!e.target.closest(".theme-picker")) {
    document.getElementById("themePalette")?.classList.remove("open");
    document.getElementById("designPalette")?.classList.remove("open");
    document.getElementById("themeCurrentBtn")?.setAttribute("aria-expanded", "false");
    document.getElementById("designCurrentBtn")?.setAttribute("aria-expanded", "false");
  }
});

// Fechar com ESC
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    document.getElementById("themePalette")?.classList.remove("open");
    document.getElementById("designPalette")?.classList.remove("open");

/* ==================== PERSISTÊNCIA POR MÊS/ANO ==================== */
// Estrutura: { "2026-4": { mode: "simple", slots: 1, entries: [...] }, ... }
const scheduleStore = {};
let currentMonthKey = null; // chave do mês atualmente exibido

function getMonthKey(month, year) {
  return `${year}-${month}`;
}

/* Captura o estado atual da tabela e retorna como objeto serializável */
function captureCurrentState() {
  const mode = getMode();
  const entries = [];

  if (mode === "simple") {
    document.querySelectorAll(".cell-select").forEach(sel => {
      if (!sel.value) return;
      const cell = sel.closest("td");
      const dayEl = cell?.querySelector(".day");
      const day = dayEl ? parseInt(dayEl.innerText) : null;
      if (day) entries.push({ d: day, v: sel.value });
    });
  } else {
    document.querySelectorAll("#calendar tbody td:not(.empty)").forEach(cell => {
      const dayEl = cell.querySelector(".day");
      const day = dayEl ? parseInt(dayEl.innerText) : null;
      if (!day) return;

      SHIFTS.forEach(shiftKey => {
        const slots = cell.querySelectorAll(`.shift[data-shift="${shiftKey}"] .shift-select`);
        const values = Array.from(slots).map(s => s.value);
        // Só salvar se houver pelo menos um valor
        if (values.some(v => v !== "")) {
          entries.push({ d: day, sh: shiftKey, v: values });
        }
      });
    });
  }

  return { mode, slots: slotsPerShift, entries };
}

/* Salva o estado atual no store sob a chave do mês atual */
function saveCurrentMonth() {
  if (!currentMonthKey) return;
  const state = captureCurrentState();
  if (state.entries.length > 0) {
    scheduleStore[currentMonthKey] = state;
  } else {
    // Se vazio, remover do store para não ocupar memória
    delete scheduleStore[currentMonthKey];
  }
}

/* Restaura entradas salvas na tabela atual */
function restoreEntries(entries, savedMode, savedSlots) {
  if (!entries || entries.length === 0) return;

  const currentMode = getMode();
  // Se o modo do salvamento difere do atual, tentar adaptar
  // (mas só restaura o que cabe; o resto fica perdido)

  entries.forEach(entry => {
    if (entry.sh) {
      // Entrada avançada
      if (currentMode === "advanced") {
        const shifts = {};
        shifts[entry.sh] = entry.v;
        setCellShifts(entry.d, shifts);
      } else {
        // Avançado → simples: pegar primeiro valor não-vazio
        const firstVal = entry.v.find(v => v !== "");
        if (firstVal) setCellValue(entry.d, firstVal);
      }
    } else {
      // Entrada simples
      if (currentMode === "simple") {
        setCellValue(entry.d, entry.v);
      } else {
        // Simples → avançado: colocar no slot 1 do M
        setCellShifts(entry.d, { M: [entry.v] });
      }
    }
  });
}

/* Quando o mês ou ano muda, salva o atual e carrega o novo */
function handleMonthOrYearChange() {
  // 1. Salvar mês atual
  saveCurrentMonth();

  // 2. Atualizar chave para o novo mês
  const newMonth = parseInt(monthSelect.value);
  const newYear = parseInt(yearSelect.value);
  const newKey = getMonthKey(newMonth, newYear);

  // 3. Se o novo mês tem estado salvo, ajustar mode/slots ANTES de gerar
  const saved = scheduleStore[newKey];
  if (saved) {
    if (saved.mode && saved.mode !== getMode()) {
      document.documentElement.setAttribute("data-mode", saved.mode);
      document.getElementById("modeSimpleBtn").classList.toggle("active", saved.mode === "simple");
      document.getElementById("modeAdvancedBtn").classList.toggle("active", saved.mode === "advanced");
    }
    if (saved.slots && saved.slots !== slotsPerShift) {
      slotsPerShift = saved.slots;
      document.getElementById("slotsValue").innerText = slotsPerShift;
      document.getElementById("slotsMinus").disabled = slotsPerShift <= 1;
      document.getElementById("slotsPlus").disabled = slotsPerShift >= 5;
    }
  }

  // 4. Gerar o calendário
  currentMonthKey = newKey;
  generateCalendar();

  // 5. Restaurar entradas se houver
  if (saved) {
    restoreEntries(saved.entries, saved.mode, saved.slots);
    updateCounts();
  }
}

/* ==================== MODO E SLOTS ==================== */
let slotsPerShift = 1;
const SHIFTS = ["M", "T", "N"]; // Manhã, Tarde, Noite

function getMode() {
  return document.documentElement.getAttribute("data-mode") || "simple";
}

function setMode(mode) {
  const previous = getMode();
  if (previous === mode) return;

  // Capturar dados ANTES de trocar modo
  const captured = captureCurrentState();

  document.documentElement.setAttribute("data-mode", mode);
  document.getElementById("modeSimpleBtn").classList.toggle("active", mode === "simple");
  document.getElementById("modeAdvancedBtn").classList.toggle("active", mode === "advanced");

  // Regerar a tabela com a nova estrutura
  generateCalendar();

  // Restaurar os dados capturados (com adaptação entre modos)
  if (captured.entries.length > 0) {
    restoreEntries(captured.entries, captured.mode, captured.slots);
    updateCounts();
    saveCurrentMonth();
  }
}

function hasAnyAssignment() {
  if (getMode() === "simple") {
    return Array.from(document.querySelectorAll(".cell-select"))
      .some(s => s.value && s.value !== "");
  } else {
    return Array.from(document.querySelectorAll(".shift-select"))
      .some(s => s.value && s.value !== "");
  }
}

function changeSlots(delta) {
  const next = Math.max(1, Math.min(5, slotsPerShift + delta));
  if (next === slotsPerShift) return;
  slotsPerShift = next;
  document.getElementById("slotsValue").innerText = next;
  document.getElementById("slotsMinus").disabled = next <= 1;
  document.getElementById("slotsPlus").disabled = next >= 5;

  // Se em modo avançado, re-renderizar os slots preservando o que dá
  if (getMode() === "advanced") {
    rebuildShiftSlots();
  }
}

/* Reconstrói os slots de cada turno preservando os valores que ainda cabem */
function rebuildShiftSlots() {
  document.querySelectorAll("#calendar tbody td:not(.empty)").forEach(cell => {
    SHIFTS.forEach(shiftKey => {
      const shiftEl = cell.querySelector(`.shift[data-shift="${shiftKey}"] .shift-slots`);
      if (!shiftEl) return;
      const existingValues = Array.from(shiftEl.querySelectorAll(".shift-select")).map(s => s.value);
      shiftEl.innerHTML = "";
      for (let i = 0; i < slotsPerShift; i++) {
        shiftEl.appendChild(buildShiftSelect(existingValues[i] || ""));
      }
    });
    refreshCellState(cell);
  });
  updateCounts();
}

/* ==================== HELPERS DE CONTAGEM ==================== */
function countShifts(name) {
  let c = 0;
  if (getMode() === "simple") {
    document.querySelectorAll(".cell-select").forEach(s => { if (s.value === name) c++; });
  } else {
    document.querySelectorAll(".shift-select").forEach(s => { if (s.value === name) c++; });
  }
  return c;
}

function renderMedicos() {
  const div = document.getElementById("listaMedicos");
  document.getElementById("counter").innerText = medicos.length;

  if (medicos.length === 0) {
    div.innerHTML = '<div class="empty-state">Adicione médicos para montar a escala</div>';
  } else {
    div.innerHTML = "";
    medicos.forEach((m, i) => {
      const el = document.createElement("div");
      el.className = "medico-item";
      el.innerHTML = `
        <span class="medico-name">${m}</span>
        <span class="medico-count" id="count-${i}">0</span>
        <button class="btn-remove" onclick="removeMedico(${i})" title="Remover">×</button>
      `;
      div.appendChild(el);
    });
  }

  // Se ainda não há tabela criada, gera. Caso contrário, só atualiza as opções.
  const tbody = document.querySelector("#calendar tbody");
  if (!tbody || tbody.children.length === 0) {
    generateCalendar();
  } else {
    updateCellOptions();
  }
}

/* Atualiza as <option> dos selects existentes (em qualquer modo), preservando valores */
function updateCellOptions() {
  const optionsHTML = `
    <option value="">—</option>
    <option value="${BLOCK}">Bloqueado</option>
    ${medicos.map(m => `<option value="${m}">${m}</option>`).join("")}
  `;

  const allSelects = document.querySelectorAll(".cell-select, .shift-select");
  allSelects.forEach(sel => {
    const currentValue = sel.value;
    const stillExists = currentValue === "" || currentValue === BLOCK || medicos.includes(currentValue);

    sel.innerHTML = optionsHTML;

    if (stillExists) {
      sel.value = currentValue;
    } else {
      sel.value = "";
    }

    // Atualizar visuais da célula
    const cell = sel.closest("td");
    if (cell) refreshCellState(cell);
  });

  updateCounts();
}

function updateCounts() {
  medicos.forEach((m, i) => {
    const el = document.getElementById(`count-${i}`);
    if (el) el.innerText = countShifts(m);
  });
}

function addMedico() {
  const input = document.getElementById("medicoInput");
  const name = input.value.trim();
  if (name && !medicos.includes(name)) {
    medicos.push(name);
    input.value = "";
    renderMedicos();
  }
  input.focus();
}

function removeMedico(i) {
  medicos.splice(i, 1);
  renderMedicos();
}

/* ==================== BUILDERS DE CÉLULA ==================== */
function buildOptionsHTML() {
  return `
    <option value="">—</option>
    <option value="${BLOCK}">Bloqueado</option>
    ${medicos.map(m => `<option value="${m}">${m}</option>`).join("")}
  `;
}

function buildShiftSelect(value = "") {
  const sel = document.createElement("select");
  sel.className = "shift-select";
  sel.innerHTML = buildOptionsHTML();
  if (value) sel.value = value;
  applyShiftSelectStyle(sel);
  sel.onchange = () => {
    applyShiftSelectStyle(sel);
    refreshCellState(sel.closest("td"));
    updateCounts();
  };
  return sel;
}

function applyShiftSelectStyle(sel) {
  sel.classList.remove("has-value", "is-block");
  if (sel.value === BLOCK) {
    sel.classList.add("is-block");
  } else if (sel.value !== "") {
    sel.classList.add("has-value");
  }
}

/* Recalcula classes da célula com base nos valores atuais */
function refreshCellState(cell) {
  if (!cell) return;

  if (getMode() === "simple") {
    const sel = cell.querySelector(".cell-select");
    if (!sel) return;
    cell.classList.remove("blocked", "assigned");
    if (sel.value === BLOCK) cell.classList.add("blocked");
    else if (sel.value !== "") cell.classList.add("assigned");
  } else {
    // Avançado: célula fica "fully-blocked" se TODOS os shifts estiverem bloqueados
    const shifts = cell.querySelectorAll(".shift-select");
    if (shifts.length === 0) return;
    const allBlocked = Array.from(shifts).every(s => s.value === BLOCK);
    cell.classList.toggle("fully-blocked", allBlocked);
  }
}

function generateCalendar() {
  const month = parseInt(monthSelect.value);
  const year = parseInt(yearSelect.value);

  document.getElementById("monthLabel").innerHTML =
    `<strong>${months[month]}</strong> · ${year}`;

  const tbody = document.querySelector("#calendar tbody");
  tbody.innerHTML = "";

  const firstDay = new Date(year, month, 1);
  const lastDate = new Date(year, month + 1, 0).getDate();

  let startDay = firstDay.getDay();
  startDay = startDay === 0 ? 6 : startDay - 1;

  let row = document.createElement("tr");

  for (let i = 0; i < startDay; i++) {
    const td = document.createElement("td");
    td.classList.add("empty");
    row.appendChild(td);
  }

  const mode = getMode();

  for (let day = 1; day <= lastDate; day++) {
    const cell = document.createElement("td");
    const date = new Date(year, month, day);
    const dow = date.getDay();

    if (dow === 0 || dow === 6) cell.classList.add("weekend");

    const dayDiv = document.createElement("div");
    dayDiv.className = "day";
    dayDiv.innerText = day;
    cell.appendChild(dayDiv);

    if (mode === "simple") {
      const select = document.createElement("select");
      select.className = "cell-select";
      select.innerHTML = buildOptionsHTML();
      select.onchange = () => {
        refreshCellState(cell);
        updateCounts();
      };
      cell.appendChild(select);
    } else {
      // Modo avançado: 3 turnos com N slots cada
      const shiftsWrap = document.createElement("div");
      shiftsWrap.className = "shifts";
      SHIFTS.forEach(shiftKey => {
        const shiftDiv = document.createElement("div");
        shiftDiv.className = "shift";
        shiftDiv.dataset.shift = shiftKey;

        const tag = document.createElement("div");
        tag.className = "shift-tag";
        tag.innerText = shiftKey;
        shiftDiv.appendChild(tag);

        const slotsWrap = document.createElement("div");
        slotsWrap.className = "shift-slots";
        for (let i = 0; i < slotsPerShift; i++) {
          slotsWrap.appendChild(buildShiftSelect());
        }
        shiftDiv.appendChild(slotsWrap);

        shiftsWrap.appendChild(shiftDiv);
      });
      cell.appendChild(shiftsWrap);
    }

    row.appendChild(cell);

    if ((startDay + day) % 7 === 0) {
      tbody.appendChild(row);
      row = document.createElement("tr");
    }
  }

  while (row.children.length > 0 && row.children.length < 7) {
    const td = document.createElement("td");
    td.classList.add("empty");
    row.appendChild(td);
  }
  if (row.children.length > 0) tbody.appendChild(row);

  updateCounts();
}

function updateSignatureState() {
  const nameEl = document.querySelector(".signature-name");
  const block = document.getElementById("signatureBlock");
  if (!nameEl || !block) return;

  // Pega só o texto, ignorando <br> e zero-width chars
  const text = (nameEl.innerText || "").replace(/[\u200B-\u200D\uFEFF\s]/g, "");
  const isEmpty = text.length === 0;

  nameEl.setAttribute("data-empty", isEmpty ? "true" : "false");
  block.setAttribute("data-hidden", isEmpty ? "true" : "false");
}

// Inicializar estado da assinatura
document.addEventListener("DOMContentLoaded", updateSignatureState);

/* ==================== AJUSTE DE DENSIDADE PARA PDF ==================== */
/*
 * Estratégia: aplicar uma classe + variáveis CSS no body que reduzem TUDO
 * proporcionalmente, baseado na densidade calculada. Sem transform:scale.
 */
function applyPdfDensity() {
  const tbody = document.querySelector("#calendar tbody");
  const rowCount = tbody ? tbody.children.length : 6;
  const mode = getMode();

  document.body.classList.remove("pdf-d1", "pdf-d2", "pdf-d3", "pdf-d4");

  if (mode === "simple") {
    document.body.classList.add(rowCount >= 6 ? "pdf-d2" : "pdf-d1");
    return;
  }

  // Modo avançado: medir densidade real
  let maxFilledInCell = 0;
  let maxFilledInShift = 0;

  document.querySelectorAll("#calendar tbody td:not(.empty)").forEach(cell => {
    let cellFilled = 0;
    SHIFTS.forEach(shiftKey => {
      const slots = cell.querySelectorAll(`.shift[data-shift="${shiftKey}"] .shift-select`);
      const filled = Array.from(slots).filter(s => s.value && s.value !== "").length;
      cellFilled += filled;
      if (filled > maxFilledInShift) maxFilledInShift = filled;
    });
    if (cellFilled > maxFilledInCell) maxFilledInCell = cellFilled;
  });

  const totalLines = Math.max(maxFilledInCell, 3);

  // Limiares mais generosos - prefere fontes maiores, só reduz quando realmente preciso
  // Considera: o caso do TESTE5 (15 médicos numa célula) usa pdf-d3 (8px), bem legível
  let level;
  if (totalLines >= 18 || (rowCount >= 6 && totalLines >= 14)) {
    level = 4;
  } else if (totalLines >= 12 || (rowCount >= 6 && totalLines >= 8)) {
    level = 3;
  } else if (totalLines >= 6 || (rowCount >= 6 && totalLines >= 4)) {
    level = 2;
  } else {
    level = 1;
  }

  document.body.classList.add(`pdf-d${level}`);
}

function clearPdfDensity() {
  document.body.classList.remove("pdf-d1", "pdf-d2", "pdf-d3", "pdf-d4");
}

function exportPDF() {
  // Garantir que o estado da assinatura está correto antes de imprimir
  updateSignatureState();

  // Calcular e aplicar densidade ideal para caber em 1 página
  applyPdfDensity();

  const mode = getMode();
  const inserted = [];
  const scheduleData = []; // dados estruturados para o vault

  if (mode === "simple") {
    document.querySelectorAll(".cell-select").forEach(sel => {
      const cell = sel.closest("td");
      const dayEl = cell?.querySelector(".day");
      const day = dayEl ? parseInt(dayEl.innerText) : null;

      if (day && sel.value && sel.value !== "") {
        scheduleData.push({
          d: day,
          v: sel.value === BLOCK ? "__B__" : sel.value
        });
      }

      // Pular dias bloqueados - mostrar apenas a hachura no PDF
      if (sel.value === BLOCK) return;

      if (sel.value && sel.value !== "") {
        const span = document.createElement("div");
        span.className = "print-text";
        span.innerText = sel.value;
        sel.parentNode.appendChild(span);
        inserted.push(span);
      }
    });
  } else {
    // Modo avançado: percorrer células, capturar M/T/N
    document.querySelectorAll("#calendar tbody td:not(.empty)").forEach(cell => {
      const dayEl = cell.querySelector(".day");
      const day = dayEl ? parseInt(dayEl.innerText) : null;
      if (!day) return;

      SHIFTS.forEach(shiftKey => {
        const slots = cell.querySelectorAll(`.shift[data-shift="${shiftKey}"] .shift-select`);
        const values = Array.from(slots).map(s => s.value);
        const filled = values.filter(v => v !== "");

        if (filled.length === 0) return;

        // Salvar no vault: array de valores por turno (preserva ordem dos slots)
        scheduleData.push({
          d: day,
          sh: shiftKey,
          v: filled.map(v => v === BLOCK ? "__B__" : v)
        });
      });

      // Renderizar conteúdo de impressão (substitui selects)
      const shiftsWrap = cell.querySelector(".shifts");
      if (!shiftsWrap) return;

      let cellHasAnyContent = false;

      SHIFTS.forEach(shiftKey => {
        const shiftEl = shiftsWrap.querySelector(`.shift[data-shift="${shiftKey}"]`);
        if (!shiftEl) return;
        const slotsContainer = shiftEl.querySelector(".shift-slots");
        const slots = slotsContainer.querySelectorAll(".shift-select");

        const printContainer = document.createElement("div");
        printContainer.className = "shift-slots-print";

        let hasContent = false;
        slots.forEach(s => {
          if (s.value === BLOCK) {
            // Bloqueado: não imprime nada (hachura cobre)
            hasContent = true; // ainda conta para mostrar a tag
            return;
          }
          if (s.value !== "") {
            const line = document.createElement("div");
            line.className = "shift-print-line";
            line.innerText = s.value;
            printContainer.appendChild(line);
            hasContent = true;
          }
        });

        if (hasContent) {
          slotsContainer.appendChild(printContainer);
          inserted.push(printContainer);
          cellHasAnyContent = true;
        } else {
          // Marcar turno vazio para CSS esconder na impressão
          shiftEl.classList.add("shift-empty-print");
          inserted.push({ remove: () => shiftEl.classList.remove("shift-empty-print") });
        }
      });

      // Se a célula inteira está vazia, marcar para esconder turnos
      if (!cellHasAnyContent) {
        cell.classList.add("cell-empty-print");
        inserted.push({ remove: () => cell.classList.remove("cell-empty-print") });
      }
    });
  }

  // Pegar título, hospital e dados do coordenador
  const titleEl = document.querySelector(".title");
  const hospitalEl = document.querySelector(".hospital-name");
  const sigNameEl = document.querySelector(".signature-name");
  const sigLabelEl = document.querySelector(".signature-label");

  const titleRaw = (titleEl?.innerText || "Escala Médica").trim();
  const hospitalRaw = (hospitalEl?.innerText || "").trim();

  const coordName = (sigNameEl?.innerText || "")
    .replace(/[\u200B-\u200D\uFEFF]/g, "")
    .trim();
  const coordLabel = (sigLabelEl?.innerText || "").trim();

  const titleText = titleRaw
    .toLowerCase()
    .replace(/\s+/g, "-")
    .replace(/[^\w\u00C0-\u017F-]/g, "")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "")
    || "escala";

  // Construir payload do vault (esteganograma invisível)
  const payload = {
    v: 2, // versão do schema (v2 inclui modo avançado)
    mode: mode,
    slots: mode === "advanced" ? slotsPerShift : null,
    t: titleRaw,
    h: hospitalRaw,
    m: parseInt(monthSelect.value),
    y: parseInt(yearSelect.value),
    docs: medicos,
    s: scheduleData,
    c: coordName ? { n: coordName, l: coordLabel } : null
  };

  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  const vault = document.getElementById("pdfDataVault");
  vault.innerText = `«ESC-START»${encoded}«ESC-END»`;

  const originalTitle = document.title;
  document.title = `${titleText}-${months[monthSelect.value].toLowerCase()}-${yearSelect.value}`;

  setTimeout(() => {
    window.print();
    setTimeout(() => {
      inserted.forEach(s => s.remove());
      vault.innerText = "";
      document.title = originalTitle;
      clearPdfDensity();
    }, 500);
  }, 100);
}

/* ==================== IMPORTAÇÃO ==================== */
let pendingImport = null;

async function handleImport(event) {
  const file = event.target.files[0];
  event.target.value = ""; // permite reimportar o mesmo arquivo
  if (!file) return;

  if (!window.pdfjsLib) {
    showToast("Biblioteca de leitura de PDF não carregou. Verifique sua conexão.", "error");
    return;
  }

  try {
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

    let fullText = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += content.items.map(item => item.str).join("");
    }

    // Extrair payload entre delimitadores
    const match = fullText.match(/«ESC-START»([A-Za-z0-9+/=]+)«ESC-END»/);
    if (!match) {
      showToast("PDF não contém dados de escala (gerado por outro sistema?)", "error");
      return;
    }

    const decoded = decodeURIComponent(escape(atob(match[1])));
    const payload = JSON.parse(decoded);

    if (!payload.v || !payload.s) {
      showToast("Dados da escala em formato inválido.", "error");
      return;
    }

    pendingImport = payload;
    showImportModal(payload);
  } catch (err) {
    console.error(err);
    showToast("Erro ao ler o PDF: " + err.message, "error");
  }
}

function showImportModal(payload) {
  const meta = document.getElementById("modalMeta");
  const monthName = months[payload.m] || "?";

  // Contagem que funciona com payloads v1 e v2
  let totalAtribs = 0;
  let totalBloq = 0;
  payload.s.forEach(entry => {
    if (entry.sh && Array.isArray(entry.v)) {
      entry.v.forEach(v => {
        if (v === "__B__") totalBloq++;
        else totalAtribs++;
      });
    } else {
      if (entry.v === "__B__") totalBloq++;
      else totalAtribs++;
    }
  });

  let coordLine = "";
  if (payload.c && payload.c.n) {
    coordLine = `<div><strong>Coordenador:</strong> ${payload.c.n}${payload.c.l ? " · " + payload.c.l : ""}</div>`;
  }

  const modeLabel = payload.mode === "advanced"
    ? `Avançado (${payload.slots || 1} médico${(payload.slots || 1) > 1 ? "s" : ""}/turno)`
    : "Simples";

  meta.innerHTML = `
    <div><strong>Origem:</strong> ${payload.t || "Escala"} — ${monthName} / ${payload.y}</div>
    <div><strong>Modo:</strong> ${modeLabel}</div>
    <div><strong>Médicos:</strong> ${payload.docs.length} (${payload.docs.join(", ") || "—"})</div>
    <div><strong>Plantões registrados:</strong> ${totalAtribs} atribuídos · ${totalBloq} bloqueados</div>
    ${coordLine}
    <div><strong>Aplicar em:</strong> ${months[parseInt(monthSelect.value)]} / ${yearSelect.value}</div>
  `;

  document.getElementById("importModal").classList.add("open");
}

function closeImportModal() {
  document.getElementById("importModal").classList.remove("open");
  pendingImport = null;
}

function applyImport() {
  if (!pendingImport) return;

  const mode = document.querySelector('input[name="importMode"]:checked').value;
  const payload = pendingImport;

  // 1. Importar a lista de médicos (mesclar sem duplicar)
  payload.docs.forEach(doc => {
    if (doc && !medicos.includes(doc)) medicos.push(doc);
  });

  // 1a. Restaurar título e hospital (sempre - são parte da identidade da escala)
  if (payload.t) {
    const titleEl = document.querySelector(".title");
    if (titleEl) titleEl.innerText = payload.t;
  }
  if (payload.h) {
    const hospitalEl = document.querySelector(".hospital-name");
    if (hospitalEl) hospitalEl.innerText = payload.h;
  }

  // 1b. Importar dados do coordenador (apenas se os campos atuais estão vazios)
  if (payload.c && payload.c.n) {
    const sigNameEl = document.querySelector(".signature-name");
    const sigLabelEl = document.querySelector(".signature-label");

    const currentName = (sigNameEl?.innerText || "")
      .replace(/[\u200B-\u200D\uFEFF\s]/g, "");

    if (sigNameEl && currentName.length === 0) {
      sigNameEl.innerText = payload.c.n;
      if (sigLabelEl && payload.c.l) {
        sigLabelEl.innerText = payload.c.l;
      }
      updateSignatureState();
    }
  }

  // 2. Detectar modo do payload e ajustar UI se necessário
  const payloadMode = payload.mode || "simple";
  const currentMode = getMode();

  let modeChanged = false;
  if (payloadMode !== currentMode) {
    const sure = confirm(
      `O PDF importado está em modo "${payloadMode === "advanced" ? "Avançado" : "Simples"}", ` +
      `mas o sistema está em modo "${currentMode === "advanced" ? "Avançado" : "Simples"}".\n\n` +
      `Deseja trocar para o modo do PDF?`
    );
    if (sure) {
      document.documentElement.setAttribute("data-mode", payloadMode);
      document.getElementById("modeSimpleBtn").classList.toggle("active", payloadMode === "simple");
      document.getElementById("modeAdvancedBtn").classList.toggle("active", payloadMode === "advanced");
      modeChanged = true;
    }
  }

  // Se modo avançado e payload tem slots, ajustar
  if (getMode() === "advanced" && payload.slots) {
    const newSlots = Math.max(1, Math.min(5, payload.slots));
    if (newSlots !== slotsPerShift) {
      slotsPerShift = newSlots;
      document.getElementById("slotsValue").innerText = slotsPerShift;
      document.getElementById("slotsMinus").disabled = slotsPerShift <= 1;
      document.getElementById("slotsPlus").disabled = slotsPerShift >= 5;
      modeChanged = true; // força regeração para refletir novos slots
    }
  }

  // CRÍTICO: se mudou modo ou slots, regerar a tabela ANTES de aplicar dados
  if (modeChanged) {
    generateCalendar();
  }

  // 3. Construir índice da escala antiga
  const oldMonth = payload.m;
  const oldYear = payload.y;
  const importMode = getMode();

  // No modo simples: oldMap[d] = valor
  // No modo avançado: oldMap[d] = { M: [v1, v2], T: [...], N: [...] }
  const oldMap = {};
  payload.s.forEach(entry => {
    if (entry.sh) {
      // entrada avançada
      if (!oldMap[entry.d]) oldMap[entry.d] = {};
      oldMap[entry.d][entry.sh] = Array.isArray(entry.v) ? entry.v : [entry.v];
    } else {
      // entrada simples
      oldMap[entry.d] = entry.v;
    }
  });

  // 4. Aplicar replicação no mês ATUAL
  const newMonth = parseInt(monthSelect.value);
  const newYear = parseInt(yearSelect.value);
  const newLastDay = new Date(newYear, newMonth + 1, 0).getDate();

  // Atualizar a sidebar com a lista de médicos (sem mexer na tabela já gerada)
  document.getElementById("counter").innerText = medicos.length;
  const sidebarDiv = document.getElementById("listaMedicos");
  if (medicos.length === 0) {
    sidebarDiv.innerHTML = '<div class="empty-state">Adicione médicos para montar a escala</div>';
  } else {
    sidebarDiv.innerHTML = "";
    medicos.forEach((m, i) => {
      const el = document.createElement("div");
      el.className = "medico-item";
      el.innerHTML = `
        <span class="medico-name">${m}</span>
        <span class="medico-count" id="count-${i}">0</span>
        <button class="btn-remove" onclick="removeMedico(${i})" title="Remover">×</button>
      `;
      sidebarDiv.appendChild(el);
    });
  }

  // Atualizar as <option> dos selects (com a lista de médicos potencialmente expandida)
  // Se modeChanged, a tabela já tem as opções corretas
  if (!modeChanged) {
    updateCellOptions();
  }

  let applied = 0;
  const applyEntry = (newDay, sourceData) => {
    if (importMode === "simple") {
      // Se o payload é avançado mas estamos em simples, pegar o primeiro valor do M
      if (typeof sourceData === "object") {
        const firstShift = sourceData.M || sourceData.T || sourceData.N;
        if (!firstShift || !firstShift[0]) return false;
        return setCellValue(newDay, firstShift[0]);
      }
      return setCellValue(newDay, sourceData);
    } else {
      // modo avançado
      if (typeof sourceData !== "object") {
        // payload simples sendo aplicado em avançado: colocar tudo no M (primeiro slot)
        return setCellShifts(newDay, { M: [sourceData] });
      }
      return setCellShifts(newDay, sourceData);
    }
  };

  if (mode === "exact-date") {
    for (let d = 1; d <= newLastDay; d++) {
      if (oldMap[d] !== undefined) {
        if (applyEntry(d, oldMap[d])) applied++;
      }
    }
  } else if (mode === "weekday-simple") {
    const byDow = {};
    const sortedDays = Object.keys(oldMap).map(Number).sort((a,b) => a-b);
    sortedDays.forEach(day => {
      const dow = new Date(oldYear, oldMonth, day).getDay();
      byDow[dow] = oldMap[day];
    });

    for (let d = 1; d <= newLastDay; d++) {
      const dow = new Date(newYear, newMonth, d).getDay();
      if (byDow[dow] !== undefined) {
        if (applyEntry(d, byDow[dow])) applied++;
      }
    }
  } else {
    // weekday-ordinal (PADRÃO)
    const byOrdinal = {};
    Object.keys(oldMap).map(Number).sort((a,b) => a-b).forEach(day => {
      const dow = new Date(oldYear, oldMonth, day).getDay();
      const ordinal = Math.ceil(day / 7);
      byOrdinal[`${dow}-${ordinal}`] = oldMap[day];
    });

    for (let d = 1; d <= newLastDay; d++) {
      const dow = new Date(newYear, newMonth, d).getDay();
      const ordinal = Math.ceil(d / 7);
      const key = `${dow}-${ordinal}`;
      if (byOrdinal[key] !== undefined) {
        if (applyEntry(d, byOrdinal[key])) applied++;
      }
    }
  }

  updateCounts();
  saveCurrentMonth();
  closeImportModal();
  showToast(`Escala importada: ${applied} ${applied === 1 ? "atribuição aplicada" : "atribuições aplicadas"}`, "success");
}

/* Helper: encontra a célula correspondente a um dia */
function findCellByDay(day) {
  const cells = document.querySelectorAll("#calendar tbody td");
  for (const cell of cells) {
    if (cell.classList.contains("empty")) continue;
    const dayEl = cell.querySelector(".day");
    if (dayEl && parseInt(dayEl.innerText) === day) return cell;
  }
  return null;
}

/* Aplica um valor a uma célula no MODO SIMPLES */
function setCellValue(day, value) {
  const cell = findCellByDay(day);
  if (!cell) return false;
  const sel = cell.querySelector(".cell-select");
  if (!sel) return false;

  const realValue = value === "__B__" ? BLOCK : value;

  const optionExists = Array.from(sel.options).some(o => o.value === realValue);
  if (!optionExists) return false;

  sel.value = realValue;
  refreshCellState(cell);
  return true;
}

/* Aplica turnos a uma célula no MODO AVANÇADO */
/* shifts: { M: [v1, v2], T: [...], N: [...] } */
function setCellShifts(day, shifts) {
  const cell = findCellByDay(day);
  if (!cell) return false;

  let anyApplied = false;

  SHIFTS.forEach(shiftKey => {
    if (!shifts[shiftKey]) return;
    const slots = cell.querySelectorAll(`.shift[data-shift="${shiftKey}"] .shift-select`);
    const values = shifts[shiftKey];

    slots.forEach((sel, idx) => {
      if (idx >= values.length) return;
      const raw = values[idx];
      const realValue = raw === "__B__" ? BLOCK : raw;
      const optionExists = Array.from(sel.options).some(o => o.value === realValue);
      if (optionExists) {
        sel.value = realValue;
        applyShiftSelectStyle(sel);
        anyApplied = true;
      }
    });
  });

  refreshCellState(cell);
  return anyApplied;
}

/* Toast simples */
let toastTimeout;
function showToast(msg, kind = "") {
  const el = document.getElementById("toast");
  el.className = "toast show" + (kind ? " " + kind : "");
  el.innerText = msg;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    el.classList.remove("show");
  }, 4000);
}

/* Fechar modal ao clicar no backdrop */
document.getElementById("importModal").addEventListener("click", e => {
  if (e.target.id === "importModal") closeImportModal();
});

/* ESC fecha modal */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.getElementById("importModal").classList.contains("open")) {
    closeImportModal();
  }
});

monthSelect.onchange = handleMonthOrYearChange;
yearSelect.onchange = handleMonthOrYearChange;

// Inicializar estado dos controles de slot
document.getElementById("slotsMinus").disabled = slotsPerShift <= 1;
document.getElementById("slotsPlus").disabled = slotsPerShift >= 5;

// Inicializar chave do mês atual
currentMonthKey = getMonthKey(parseInt(monthSelect.value), parseInt(yearSelect.value));

// Marcar tema atual no color picker
const initialTheme = document.documentElement.getAttribute("data-theme") || "blue";
document.querySelectorAll(".theme-opt").forEach(btn => {
  btn.setAttribute("data-active", btn.dataset.color === initialTheme ? "true" : "false");
});

// Marcar design padrão e atualizar ícone do botão
const initialStyle = document.documentElement.getAttribute("data-style") || "default";
document.querySelectorAll(".design-opt").forEach(btn => {
  btn.setAttribute("data-active", btn.dataset.style === initialStyle ? "true" : "false");
});
updateDesignCurrentIcon(initialStyle);

renderMedicos();
</script>
